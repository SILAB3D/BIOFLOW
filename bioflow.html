function phPopMeta(p){const f=(p.freq||'').toString().trim();const c=(p.count||'').toString().trim();const parts=[];if(f)parts.push(f+'%');if(c)parts.push(c+' células/µl');return parts.length?' ('+parts.join('; ')+')':'';}
// Etiqueta para TXT: "het"→"heterog" y las "d" (intensidad débil)→"débil"
function phTxtLabel(id){let l=phLabelOf(id);if(!l)return '';const e=S.ph.export||{};let out=l;if(e.convertHet!==false)out=out.replace(/het/gi,(e.hetWord||'heterog'));if(e.convertD!==false)out=out.replace(/d/g,(e.dWord||'débil'));return out.replace(/−/g,'-');}
function phXlLabel(id){return phLabelOf(id).replace(/−/g,'-');}
function phHasVal(v){return v!=null&&v!=='';}
// Datos para .xlsx: la expresión se escribe tal cual (sin "=" ni "'") porque las celdas son de tipo texto. Se omiten los marcadores sin expresión en ninguna población.
function phSampleAOA(s){
  const cls=phClassifySample(s);
  const used=s.markers.filter(m=>s.populations.some(p=>phHasVal(p.values[m.id])));
  const header=['Población','Identificador','Frecuencia (%)','Valor absoluto (cél/uL)',...used.map(m=>m.name),'Comentario'];
  const rows=s.populations.map(p=>[p.title,p.ident||'',p.freq||'',p.count||'',...used.map(m=>phXlLabel(p.values[m.id])),p.comment||'']);
  const tipo=['Tipo','','','',...used.map(m=>phClsLabel(cls[m.id])),''];
  const stat=(label,key)=>[label,'','',''].concat(used.map(m=>phMarkerPct(s,m)[key])).concat(['']);
  return [['Muestra: '+s.title],s.desc?['Descripción: '+s.desc]:[],['Nº total de poblaciones: '+s.populations.length],[],header,...rows,[],tipo,[],stat('n positivo','pos'),stat('n negativo','neg'),stat('n heterogéneo','het'),[],stat('% positivo','pp'),stat('% negativo','np'),stat('% heterogéneo','hp')];
}
// TXT: formato lineal por población (Clon Nombre (freq%; abs células/μl): marcadores), orden alfabético/numérico. Se omiten los marcadores sin expresión en cada población.
function phSampleTXT(s){
  const markers=phExportMarkers(s);
  const out=['Muestra: '+s.title];
  if(s.desc)out.push('Descripción: '+s.desc);
  out.push('Nº total de poblaciones: '+s.populations.length);
  out.push('');
  if(!s.populations.length)out.push('(Sin poblaciones)');
  s.populations.forEach(p=>{
    const items=markers.filter(m=>phHasVal(p.values[m.id])).map(m=>m.name+phTxtLabel(p.values[m.id]));
    let line='Clon '+p.title+((p.ident||'').trim()?' ['+p.ident.trim()+']':'')+phPopMeta(p)+': '+items.join(', ')+'.';
    if((p.comment||'').trim())line+='\n    Comentario: '+p.comment.trim();
    out.push(line);
  });
  const pct=markers.map(m=>({m,r:phMarkerPct(s,m)})).filter(x=>x.r.base>0);
  if(pct.length){
    out.push('');
    out.push('% de expresión (positivo / negativo / heterogéneo):');
    pct.forEach(x=>out.push('  '+x.m.name+': '+x.r.pp+' / '+x.r.np+' / '+x.r.hp));
  }
  return out.join('\n');
}

function phCompareAOA(){const rows=V.cmp.map(({sid,pid})=>{const sm=phSample(sid);if(!sm)return null;const p=sm.populations.find(x=>x.id===pid);if(!p)return null;const byName={};sm.markers.forEach(m=>{byName[m.name]=p.values[m.id];});return {st:sm.title,pt:p.title,byName};}).filter(Boolean);const names=[];rows.forEach(r=>Object.keys(r.byName).forEach(n=>{if(!names.includes(n))names.push(n);}));const cls={};names.forEach(n=>{cls[n]=phClassifyValues(rows.map(r=>r.byName[n]));});const header=['Muestra','Población',...names];const body=rows.map(r=>[r.st,r.pt,...names.map(n=>phXlLabel(r.byName[n]))]);const tipo=['','Tipo',...names.map(n=>phClsLabel(cls[n]))];return [header,...body,[],tipo];}
function phOpenExportCompare(){openModalHTML(`<div class="modal"><div class="mtit"><span class="mtit-ic">${ic('download',19)}</span>Exportar comparativa</div><div style="display:flex;flex-direction:column;gap:9px;margin-top:16px"><button class="btn btn-p" onclick="phCopyCompare()">${ic('copy',16)} Copiar para Excel (portapapeles)</button><button class="btn btn-g" onclick="phExportCompare('xlsx')">${ic('sheet',16)} Excel (.xlsx)</button><button class="btn btn-g" onclick="phExportCompare('txt')">${ic('file',16)} Texto (TXT)</button></div><div class="mact"><button class="btn btn-g sm" onclick="closeModal()">Cerrar</button></div></div>`);}

/* ════════ COMENTARIOS / FEEDBACK ════════ */
let fbEditId=null;
function fbList(){return Array.isArray(S.feedback)?S.feedback:(S.feedback=[]);}
function fbOpenCount(){return fbList().filter(f=>!f.done).length;}
function updateFbBtn(){const n=fbOpenCount();const b=document.getElementById('fbBtn');if(b){b.innerHTML=ic('message',18)+(n?`<span class="fb-badge">${n}</span>`:'');b.title='Comentarios: bugs y mejoras'+(n?` · ${n} sin resolver`:'');b.setAttribute('aria-label','Comentarios'+(n?` (${n} sin resolver)`:''));}const mn=document.getElementById('fbMenuN');if(mn)mn.textContent=n?String(n):'';}
function openFeedback(){fbEditId=null;renderFeedback();}
function renderFeedback(){
  const items=fbList();
  const list=items.length?items.map(f=>{
    if(f.id===fbEditId){
      return `<div class="fb-item editing"><div class="fb-edit">
        <select class="sel" id="fbType_${f.id}"><option value="bug"${f.type==='bug'?' selected':''}>Bug</option><option value="idea"${f.type!=='bug'?' selected':''}>Mejora</option></select>
        <textarea class="minput fb-ta" id="fbText_${f.id}" rows="3">${esc(f.text)}</textarea>
        <div class="fb-acts"><button class="btn btn-g sm" onclick="fbCancelEdit()">${ic('x',15)} Cancelar</button><button class="btn btn-p sm" onclick="fbSaveEdit('${f.id}')">${ic('check',15)} Guardar</button></div>
      </div></div>`;
    }
    return `<div class="fb-item${f.done?' done':''}">
      <button class="fb-check" title="${f.done?'Marcar como pendiente':'Marcar como resuelto'}" onclick="fbToggle('${f.id}')">${f.done?ic('circle-check',19):ic('circle-dot',19)}</button>
      <div class="fb-body">
        <div class="fb-meta"><span class="fb-tag ${f.type==='bug'?'bug':'idea'}">${f.type==='bug'?ic('bug',12)+' Bug':ic('activity',12)+' Mejora'}</span><span class="fb-date">${fmtDate(f.createdAt)}${f.done?' · resuelto':''}</span></div>
        <div class="fb-text">${esc(f.text)}</div>
      </div>
      <div class="fb-row-acts"><button class="sc-ibtn" title="Editar" onclick="fbEdit('${f.id}')">${ic('edit',17)}</button><button class="sc-ibtn" title="Eliminar" onclick="fbDelete('${f.id}')">${ic('trash',17)}</button></div>
    </div>`;
  }).join(''):'<div class="dl-empty">Aún no hay comentarios. Añade el primero arriba.</div>';
  openModalHTML(`<div class="modal" style="width:min(580px,96vw)">
    <div class="mtit"><span class="mtit-ic">${ic('message',19)}</span>Comentarios y feedback</div>
    <p class="sub" style="margin-top:2px">Anota bugs y mejoras de la app. Se guardan en tu archivo de datos.</p>
    <div class="fb-new">
      <select class="sel" id="fbNewType"><option value="bug">Bug</option><option value="idea">Mejora</option></select>
      <textarea class="minput" id="fbNewText" rows="2" placeholder="Describe el bug o la mejora…"></textarea>
      <button class="btn btn-p" onclick="fbAdd()">${ic('plus',15)} Añadir</button>
    </div>
    <div class="fb-list">${list}</div>
    <div class="mact"><button class="btn btn-g sm" onclick="closeModal()">Cerrar</button></div>
  </div>`);
  setTimeout(()=>{const ta=document.getElementById(fbEditId?('fbText_'+fbEditId):'fbNewText');if(ta){ta.focus();if(fbEditId){ta.setSelectionRange(ta.value.length,ta.value.length);}}},40);
}
function fbAdd(){const el=document.getElementById('fbNewText');const t=(el.value||'').trim();if(!t){toast('Escribe un comentario',{icon:'alert'});el.focus();return;}const type=document.getElementById('fbNewType').value;fbList().unshift({id:uid(),type,text:t,done:false,createdAt:new Date().toISOString()});save();updateFbBtn();renderFeedback();toast('Comentario añadido',{icon:'check'});}
function fbEdit(id){fbEditId=id;renderFeedback();}
function fbCancelEdit(){fbEditId=null;renderFeedback();}
function fbSaveEdit(id){const f=fbList().find(x=>x.id===id);if(!f)return;const t=(document.getElementById('fbText_'+id).value||'').trim();if(!t){toast('El comentario no puede estar vacío',{icon:'alert'});return;}f.text=t;f.type=document.getElementById('fbType_'+id).value;f.updatedAt=new Date().toISOString();fbEditId=null;save();updateFbBtn();renderFeedback();}
function fbToggle(id){const f=fbList().find(x=>x.id===id);if(!f)return;f.done=!f.done;save();updateFbBtn();renderFeedback();}
function fbDelete(id){const arr=fbList(),i=arr.findIndex(x=>x.id===id);if(i<0)return;const removed=arr[i];arr.splice(i,1);if(fbEditId===id)fbEditId=null;save();updateFbBtn();renderFeedback();toast('Comentario eliminado',{icon:'trash',actionLabel:'Deshacer',onAction:()=>{arr.splice(Math.min(i,arr.length),0,removed);save();updateFbBtn();renderFeedback();}});}

function newReportObj(){
  return {
    id:uid(), name:'Informe', nameManual:false, createdAt:new Date().toISOString(),
    header:{ logo:(window.REPORT_LOGO_DEFAULT||''), logo2:'', logoW:95, logoW2:45, servicio:'SERVICIO DE CITOMETRÍA', localizacion:'Edificio I+D+i. C/ Espejo nº 2\n37007 Salamanca', web:'http://www.usal.es/citometria' },
    info:{ titulo:'Informe de resultados', nInforme:'', fechaEmision:'', solicitante:'', fechaSolicitud:'', cif:'', nEstudio:'', idPaciente:'', fechaToma:'', tipoMuestra:'' },
    celTitle:'CELULARIDAD', celRows:[], estudios:[], fenoId:'', fenoEdits:{}, fenoExtra:[], fenoHidden:[], fenoSort:'custom', fenoOrder:[], comentario:'', conclusion:'', cfm:{comentario:'',conclusion:'',feno:{},extra:[]}
  };
}
function reportMigrate(){
  if(!Array.isArray(S.reports))S.reports=[];
  if(!S.reportPresets||typeof S.reportPresets!=='object')S.reportPresets={};
  ['header','info','celularidad','estudios','comentario'].forEach(k=>{if(!Array.isArray(S.reportPresets[k]))S.reportPresets[k]=[];});
  S.reports.forEach(r=>{
    if(!r.header||typeof r.header!=='object')r.header={};
    if(typeof r.header.logoW!=='number')r.header.logoW=95;
    if(typeof r.header.logoW2!=='number')r.header.logoW2=45;
    if(!r.info||typeof r.info!=='object')r.info={};
    if(!Array.isArray(r.celRows))r.celRows=[];
    r.celRows.forEach(row=>{if(typeof row.level!=='number')row.level=0;});
    if(!Array.isArray(r.estudios))r.estudios=[];
    if(typeof r.celTitle!=='string')r.celTitle='CELULARIDAD';
    if(typeof r.comentario!=='string')r.comentario='';
    if(typeof r.conclusion!=='string')r.conclusion='';
    if(typeof r.fenoId!=='string')r.fenoId='';
    if(!r.fenoEdits||typeof r.fenoEdits!=='object')r.fenoEdits={};
    if(!Array.isArray(r.fenoExtra))r.fenoExtra=[];
    if(!Array.isArray(r.fenoHidden))r.fenoHidden=[];
    if(r.fenoSort!=='alpha'&&r.fenoSort!=='created'&&r.fenoSort!=='custom')r.fenoSort='custom';
    if(!Array.isArray(r.fenoOrder))r.fenoOrder=[];
    if(!r.cfm||typeof r.cfm!=='object'){r.cfm={comentario:r.comentario||'',conclusion:r.conclusion||'',feno:{},extra:(r.fenoExtra||[]).slice()};if(r.fenoEdits)Object.keys(r.fenoEdits).forEach(k=>{r.cfm.feno[k]=r.fenoEdits[k];});}
    if(!r.cfm.feno||typeof r.cfm.feno!=='object')r.cfm.feno={};
    if(!Array.isArray(r.cfm.extra))r.cfm.extra=[];
    if(typeof r.name!=='string')r.name='Informe';
    if(typeof r.nameManual!=='boolean')r.nameManual=false;
    // El título sigue al "Nº de estudio en el Servicio" salvo que se edite a mano
    if(!r.nameManual){const ne=((r.info&&r.info.nEstudio)||'').toString().trim();if(ne&&(!r.name||r.name==='Informe'))r.name=uniqueName(ne,reportNames(r.id),'Informe');}
  });

/* ════════ CONTROL DE CAMBIOS — resaltado de caracteres no confirmados ════════ */
/* Diferencia el texto actual frente al confirmado y devuelve HTML con los
   fragmentos añadidos envueltos en <span class="dc-add">. Recorta prefijo y
   sufijo comunes y aplica LCS al centro (con tope de coste para textos largos). */
function dcTokens(s){return s?(s.match(/[0-9\p{L}]+|\s+|[^\s0-9\p{L}]/gu)||[]):[];}
function dcLcsParts(a,b){
  const n=a.length,m=b.length,W=m+1;
  const dp=new Uint32Array((n+1)*W);
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--){
    dp[i*W+j]=a[i]===b[j]?dp[(i+1)*W+j+1]+1:Math.max(dp[(i+1)*W+j],dp[i*W+j+1]);
  }
  const out=[];let i=0,j=0,buf='',mode=0;
  const push=(ch,md)=>{if(md!==mode){if(buf)out.push([buf,mode]);buf='';mode=md;}buf+=ch;};
  while(i<n&&j<m){
    if(a[i]===b[j]){push(b[j],0);i++;j++;}
    else if(dp[(i+1)*W+j]>=dp[i*W+j+1])i++;
    else{push(b[j],1);j++;}
  }
  while(j<m){push(b[j],1);j++;}
  if(buf)out.push([buf,mode]);
  return out;
}
function dcDiffHtml(base,cur){
  base=nmu(base);cur=nmu(cur);
  let html;
  if(cur===base||!cur)html=esc(cur);
  else{
    /* Se compara por palabras (y por signos/espacios sueltos): así lo añadido
       queda marcado de forma legible en lugar de partir las palabras por letras. */
    const A=dcTokens(base),B=dcTokens(cur);
    let p=0;while(p<A.length&&p<B.length&&A[p]===B[p])p++;
    let sf=0;while(sf<A.length-p&&sf<B.length-p&&A[A.length-1-sf]===B[B.length-1-sf])sf++;
    const midA=A.slice(p,A.length-sf),midB=B.slice(p,B.length-sf);
    let parts;
    if(!midA.length||!midB.length||midA.length*midB.length>250000)parts=[[midB.join(''),1]];
    else parts=dcLcsParts(midA,midB);
    html=esc(B.slice(0,p).join(''));
    parts.forEach(([t,add])=>{if(t)html+=add?'<span class="dc-add">'+esc(t)+'</span>':esc(t);});
    html+=esc(B.slice(B.length-sf).join(''));
  }
  return html+((cur.slice(-1)==='\n'||!cur)?'\u200b':'');
}
/* Texto confirmado de referencia para cada campo con control de cambios. */
function dcBase(key){
  const r=rGet();if(!r||!key)return '';
  if(key==='comentario'||key==='conclusion')return (r.cfm&&r.cfm[key])||'';
  if(key.indexOf('feno:')===0){
    const popId=key.slice(5);
    const cfm=(r.cfm&&r.cfm.feno&&r.cfm.feno[popId]!==undefined)?r.cfm.feno[popId]:null;
    if(cfm!==null)return cfm;
    return phCloneAuto(phSample(r.fenoId),popId,rHiddenSet());
  }
  if(key.indexOf('extra:')===0)return ((r.cfm&&r.cfm.extra)||[])[+key.slice(6)]||'';
  return '';
}

const DC_PROPS=['fontFamily','fontSize','fontWeight','fontStyle','fontVariant','fontFeatureSettings','fontKerning','lineHeight','letterSpacing','wordSpacing','textTransform','textAlign','textIndent','tabSize','whiteSpace','overflowWrap','wordBreak','paddingTop','paddingRight','paddingBottom','paddingLeft','borderTopWidth','borderRightWidth','borderBottomWidth','borderLeftWidth','borderRadius','direction'];

/* ════════ INFORME · ORDEN DEL INMUNOFENOTIPO ════════
   'custom' usa el orden propio del informe (r.fenoOrder); las poblaciones aún no
   ordenadas conservan el orden del fenotipo de origen. */
function rFenoOrderedPops(r,fs){
  if(!fs||!Array.isArray(fs.populations))return [];
  const mode=(r&&r.fenoSort)||'custom';
  const a=fs.populations.slice();
  if(mode==='alpha')a.sort((x,y)=>(x.title||'').localeCompare(y.title||'','es',{numeric:true,sensitivity:'base'}));
  else if(mode==='created')a.sort((x,y)=>(x.seq||0)-(y.seq||0));
  else{
    const ord=Array.isArray(r&&r.fenoOrder)?r.fenoOrder:[];
    const pos={};ord.forEach((id,i)=>{pos[id]=i;});
    const base={};fs.populations.forEach((p,i)=>{base[p.id]=i;});
    a.sort((x,y)=>{
      const px=pos[x.id],py=pos[y.id];
      if(px===undefined&&py===undefined)return base[x.id]-base[y.id];
      if(px===undefined)return 1;
      if(py===undefined)return -1;
      return px-py;
    });
  }
  return a;
}
/* Líneas del inmunofenotipo ya ordenadas y con la edición manual aplicada.

function rFenoLines(r,fs){
  if(!fs)return [];

  const byId={};fs.populations.forEach((p,i)=>{byId[p.id]=clones[i];});
  return rFenoOrderedPops(r,fs).map(p=>{
    const c=byId[p.id]||{head:'',body:''};
    const auto=c.head+c.body;
    const ov=r.fenoEdits?r.fenoEdits[p.id]:undefined;
    return {p:p,auto:auto,val:(ov!==undefined)?ov:auto,edited:ov!==undefined};

/* Tras mover filas, ningún nivel puede saltar más de uno respecto de la fila anterior. */
function celNormalizeLevels(rows){let prev=-1;rows.forEach(row=>{let l=row.level||0;if(l<0)l=0;if(l>prev+1)l=prev+1;row.level=l;prev=l;});}
/* Bloque de una fila: ella misma más sus subpoblaciones (niveles mayores contiguos). */
function celBlockEnd(rows,i){const lvl=rows[i].level||0;let e=i+1;while(e<rows.length&&(rows[e].level||0)>lvl)e++;return e;}
function rCelMove(i,dir){
  const r=rGet();if(!r||!r.celRows[i])return;
  const rows=r.celRows;
  const end=celBlockEnd(rows,i);
  const block=rows.slice(i,end);
  let dest;
  if(dir<0){
    if(i===0)return;
    let j=i-1;const lvl=rows[i].level||0;
    while(j>0&&(rows[j].level||0)>lvl)j--;   // subir por encima del bloque anterior completo
    dest=j;
  }else{
    if(end>=rows.length)return;
    dest=i+(celBlockEnd(rows,end)-end);      // bajar por debajo del bloque siguiente completo
  }
  rows.splice(i,block.length);
  rows.splice(dest,0,...block);
  celNormalizeLevels(rows);
  save();refreshReportEditor();
}
function rCelIndent(i,dir){const r=rGet();if(!r||!r.celRows[i])return;const rows=r.celRows;const cur=rows[i].level||0;if(dir>0){const max=i>0?(rows[i-1].level||0)+1:0;rows[i].level=Math.min(cur+1,max);}else{rows[i].level=Math.max(0,cur-1);}save();

  if(pob){const lvl=rows[i].level||0;const lc=Math.min(lvl,5);pob.style.paddingLeft=(lvl*16)+'px';const chip=pob.querySelector('.lvl-chip');if(chip){chip.className='lvl-chip lvl-'+lc;chip.title='Nivel '+lvl;chip.textContent=lvl===0?'GRAL':'N'+lvl;}updateCelVerify();updateCelColors();}

/* comprobación de sumas (no se exporta) */
function celNum(v){
  if(v==null)return null;
  let s=String(v).trim().replace(/[^\d.,\-]/g,'');
  if(!s)return null;
  const lc=s.lastIndexOf(','),ld=s.lastIndexOf('.');
  if(lc>-1&&ld>-1){
    if(lc>ld){s=s.replace(/\./g,'').replace(/,/g,'.');}   // 1.185,77 (coma decimal)
    else{s=s.replace(/,/g,'');}                            // 1,185.77 (coma de millar)
  }else if(lc>-1){
    const after=s.length-lc-1, count=(s.match(/,/g)||[]).length;
    if(count===1&&after!==3){s=s.replace(',','.');}        // 0,71  (coma decimal)
    else{s=s.replace(/,/g,'');}                            // 1,185 / 1,185,000 (millares)
  }else{
    const dots=(s.match(/\./g)||[]).length;
    if(dots>1){const i=s.lastIndexOf('.');s=s.slice(0,i).replace(/\./g,'')+'.'+s.slice(i+1);} // 1.185.770
  }
  const n=parseFloat(s);return isFinite(n)?n:null;
}
function celChildren(rows,i){const lvl=rows[i].level||0;const out=[];for(let j=i+1;j<rows.length;j++){const lj=rows[j].level||0;if(lj<=lvl)break;if(lj===lvl+1)out.push(j);}return out;}
function approxFreq(a,b){return Math.abs(a-b)<=Math.max(0.1,Math.abs(b)*0.01);}
function approxCel(a,b){return Math.abs(a-b)<=Math.max(0.5,Math.abs(b)*0.01);}
function fmtNum(n){if(n==null||!isFinite(n))return '—';return (Math.round(n*1000)/1000).toString();}
function celRange(str){if(str==null)return null;const m=String(str).match(/(-?[\d.,]+)\s*(?:-|–|—|a|to)\s*(-?[\d.,]+)/i);if(!m)return null;const a=celNum(m[1]),b=celNum(m[2]);if(a==null||b==null)return null;return [Math.min(a,b),Math.max(a,b)];}
function celOOR(valStr,refStr){const v=celNum(valStr);const r=celRange(refStr);if(v==null||!r)return false;return v<r[0]||v>r[1];}
function cvLine(label,childSum,parent,ok){
  return '<div class="cv-line '+(ok?'ok':'bad')+'"><span class="cv-line-l">'+label+'</span>'
    +'<span class="cv-line-calc">suma subpobl. <b>'+fmtNum(childSum)+'</b> '+(ok?'=':'≠')+' valor del padre <b>'+fmtNum(parent)+'</b></span>'
    +'<span class="cv-line-res">'+(ok?'✓':'✗ dif '+fmtNum(Math.abs(childSum-parent)))+'</span></div>';
}
function celVerifyHtml(r){
  const rows=r.celRows||[];if(!rows.length)return '';
  let froot=0,croot=0,hasF=false,hasC=false;
  rows.forEach(row=>{if((row.level||0)===0){const f=celNum(row.freq);if(f!=null){froot+=f;hasF=true;}const c=celNum(row.cel);if(c!=null){croot+=c;hasC=true;}}});
  const fOk=hasF?approxFreq(froot,100):true;
  let totals='<div class="cv-tot"><span class="cv-tot-l">Frecuencia — suma de poblaciones generales</span><span class="cv-tot-v '+(hasF?(fOk?'ok':'bad'):'')+'">'+(hasF?(fmtNum(froot)+'%'+(fOk?'  ✓ objetivo 100%':'  ✗ objetivo 100%')):'—')+'</span></div>';
  totals+='<div class="cv-tot"><span class="cv-tot-l">Células/µL — suma de poblaciones generales</span><span class="cv-tot-v">'+(hasC?('Σ '+fmtNum(croot)+'  (total informativo)'):'—')+'</span></div>';
  let checks='';
  rows.forEach((row,i)=>{const ch=celChildren(rows,i);if(!ch.length)return;
    let cf=0,cc=0,anyF=false,anyC=false;ch.forEach(j=>{const f=celNum(rows[j].freq);if(f!=null){cf+=f;anyF=true;}const c=celNum(rows[j].cel);if(c!=null){cc+=c;anyC=true;}});
    const pf=celNum(row.freq),pc=celNum(row.cel);const lines=[];let bad=false;
    if(pf!=null&&anyF){const ok=approxFreq(cf,pf);if(!ok)bad=true;lines.push(cvLine('Frecuencia (%)',cf,pf,ok));}
    if(pc!=null&&anyC){const ok=approxCel(cc,pc);if(!ok)bad=true;lines.push(cvLine('Células/µL',cc,pc,ok));}
    if(lines.length)checks+='<div class="cv-check '+(bad?'has-bad':'all-ok')+'"><div class="cv-name">'+esc(row.poblacion||'(sin nombre)')+'<span class="cv-sub">'+ch.length+' subpobl. directas</span></div>'+lines.join('')+'</div>';
  });
  // Chequeos ampliados
  const warn=[];
  const seen={};rows.forEach(row=>{const nm=(row.poblacion||'').trim().toLowerCase();if(nm)seen[nm]=(seen[nm]||0)+1;});
  const dups=Object.keys(seen).filter(k=>seen[k]>1);
  if(dups.length)warn.push(dups.length+' nombre(s) de población duplicado(s)');
  let imp=0;rows.forEach(row=>{const f=celNum(row.freq);if(f!=null&&(f<0||f>100))imp++;const c=celNum(row.cel);if(c!=null&&c<0)imp++;});
  if(imp)warn.push(imp+' valor(es) imposible(s): frecuencia fuera de 0–100 o células negativas');
  let oor=0;rows.forEach(row=>{if(celOOR(row.freq,row.refFreq))oor++;if(celOOR(row.cel,row.refCel))oor++;});
  if(oor)warn.push(oor+' valor(es) fuera del rango de referencia');
  const warnHtml=warn.length
    ? '<div class="cv-warns">'+warn.map(w=>'<div class="cv-warn">'+ic('alert',13)+' '+esc(w)+'</div>').join('')+'</div>'
    : '<div class="cv-warns ok-all"><div class="cv-warn ok">'+ic('circle-check',13)+' Sin avisos: nombres únicos, valores válidos y dentro de referencia.</div></div>';
  return '<div class="cel-verify"><div class="cv-title">'+ic('list-check',14)+' Comprobaciones <span class="cv-hint">no se exportan</span></div>'
    +'<div class="cv-totals">'+totals+'</div>'
    +warnHtml
    +(checks?'<div class="cv-checks">'+checks+'</div>':'<div class="cv-empty">Anida subpoblaciones (flechas) para comprobar que suman su población padre.</div>')
    +'</div>';
}

/* inmunofenotipo desde Phenotype */
function phReportClones(s,hidden){
  const markers=phExportMarkers(s);
  const hide=hidden instanceof Set?hidden:new Set(hidden||[]);
  return s.populations.map(p=>{
    const items=markers.filter(m=>!hide.has(m.id)&&phHasVal(p.values[m.id])).map(m=>m.name+phTxtLabel(p.values[m.id]));
    return {head:p.title+phPopMeta(p)+':', body:' '+items.join(', ')+'.'};
  });
}
function rHiddenSet(){const r=rGet();return new Set((r&&r.fenoHidden)||[]);}
function phReportText(s){return phReportClones(s).map(c=>c.head+c.body).join('\n');}

/* presets por apartado */
function rSectionData(r,section){
  if(section==='header')return r.header;
  if(section==='info')return r.info;
  if(section==='celularidad')return {celTitle:r.celTitle,celRows:r.celRows};
  if(section==='estudios')return {estudios:r.estudios};
  if(section==='comentario')return {comentario:r.comentario,conclusion:r.conclusion};
  return {};
}
function rSavePreset(section){
  const r=rGet();if(!r)return;
  openModalHTML(`<div class="modal"><div class="mtit"><span class="mtit-ic">${ic('tag',19)}</span>Guardar preset · ${esc(section)}</div><p class="sub" style="margin-top:2px">Se guardará este apartado para aplicarlo en otros informes.</p><input class="minput" id="rpPresetName" placeholder="Nombre del preset"><div class="mact"><button class="btn btn-g sm" onclick="closeModal()">Cancelar</button><button class="btn btn-p sm" onclick="rConfirmPreset('${section}')">${ic('check',15)} Guardar</button></div></div>`);
  setTimeout(()=>{const i=document.getElementById('rpPresetName');if(i){i.focus();}},40);
}
function rConfirmPreset(section){
  const r=rGet();if(!r)return;
  const el=document.getElementById('rpPresetName');const name=(el&&el.value||'').trim();
  if(!name){toast('Escribe un nombre para el preset',{icon:'alert'});if(el)el.focus();return;}
  (S.reportPresets[section]=S.reportPresets[section]||[]).push({id:uid(),name,data:JSON.parse(JSON.stringify(rSectionData(r,section)))});
  save();closeModal();refreshReportEditor();toast('Preset guardado',{icon:'tag'});
}
function rApplyPreset(section,pid){
  if(!pid)return;const r=rGet();if(!r)return;
  const p=(S.reportPresets[section]||[]).find(x=>x.id===pid);if(!p)return;
  const d=JSON.parse(JSON.stringify(p.data));
  if(section==='header')r.header=Object.assign({},r.header,d);
  else if(section==='info')r.info=Object.assign({},r.info,d);
  else if(section==='celularidad'){r.celTitle=d.celTitle||'CELULARIDAD';r.celRows=d.celRows||[];}
  else if(section==='estudios')r.estudios=d.estudios||[];
  else if(section==='comentario'){r.comentario=d.comentario||'';r.conclusion=d.conclusion||'';if(r.cfm){r.cfm.comentario=r.comentario;r.cfm.conclusion=r.conclusion;}}
  save();refreshReportEditor();toast('Preset aplicado',{icon:'circle-check'});
}
function rManagePresets(section){
  const list=(S.reportPresets[section]||[]);
  const items=list.length?list.map(p=>`<div class="fb-item"><div class="fb-body"><div class="fb-text">${esc(p.name)}</div></div><div class="fb-row-acts"><button class="sc-ibtn" title="Eliminar" onclick="rDelPreset('${section}','${p.id}')">${ic('trash',16)}</button></div></div>`).join(''):'<div class="dl-empty">Sin presets en este apartado.</div>';
  openModalHTML(`<div class="modal"><div class="mtit"><span class="mtit-ic">${ic('tag',19)}</span>Presets · ${esc(section)}</div><div class="fb-list" style="margin-top:10px">${items}</div><div class="mact"><button class="btn btn-g sm" onclick="closeModal()">Cerrar</button></div></div>`);
}
function rDelPreset(section,pid){S.reportPresets[section]=(S.reportPresets[section]||[]).filter(x=>x.id!==pid);save();rManagePresets(section);refreshReportEditor();}
function presetBar(section){
  const list=(S.reportPresets[section]||[]);
  const opts='<option value="">Aplicar preset…</option>'+list.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
  return `<div class="rp-presets"><select class="sel sm" onchange="rApplyPreset('${section}',this.value);this.value=''">${opts}</select><button class="btn btn-g sm" onclick="rSavePreset('${section}')">${ic('tag',13)} Guardar</button>${list.length?`<button class="btn btn-g sm" title="Gestionar presets" onclick="rManagePresets('${section}')">${ic('edit',13)}</button>`:''}</div>`;

const _crcTab=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=_crcTab[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function strBytes(s){return new TextEncoder().encode(s);}
function b64ToBytes(b64){const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
function bytesToB64(u8){let s='';const CH=0x8000;for(let i=0;i<u8.length;i+=CH)s+=String.fromCharCode.apply(null,u8.subarray(i,i+CH));return btoa(s);}
function parseDataUrl(u){const m=/^data:([^;]+);base64,([\s\S]*)$/.exec(u||'');return m?{mime:m[1],b64:m[2]}:null;}
function imgDims(src){return new Promise(res=>{const im=new Image();im.onload=()=>res({w:im.naturalWidth||300,h:im.naturalHeight||100});im.onerror=()=>res({w:300,h:100});im.src=src;});}
function downloadBytes(name,u8,mime){const blob=new Blob([u8],{type:mime||'application/octet-stream'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);}
function safeFile(s){return (s||'informe').replace(/[^0-9A-Za-zÀ-ÿ_ -]+/g,'_').replace(/\s+/g,'_').slice(0,60);}
function reportFileName(r,ext){const pre=((r.info&&r.info.nEstudio)||'').toString().trim();return (pre?safeFile(pre)+'_':'')+safeFile(r.name)+'.'+ext;}
// Ventana emergente discreta tras exportar: abrir archivo o carpeta (solo en la app de escritorio, que conoce la ruta)
function showExportPopup(path){
  if(!path||!(DESKTOP&&window.desktop.openPath)){toast('Exportado.',{icon:'circle-check'});return;}
  const name=String(path).split(/[\\/]/).pop();
  const cont=document.getElementById('toasts');if(!cont)return;
  const el=document.createElement('div');el.className='toast';
  el.innerHTML='<span class="lead">'+ic('circle-check',19)+'</span><span class="toast-msg">Exportado: <b>'+esc(name)+'</b></span>';
  const mk=(label,icon,fn)=>{const b=document.createElement('button');b.className='toast-act';b.innerHTML=ic(icon,15)+' '+label;b.onclick=()=>{try{fn();}catch(_){}dismiss();};return b;};
  el.appendChild(mk('Abrir','file',()=>window.desktop.openPath(path)));

async function saveExportBytes(name,bytes,mime){

// Copia texto al portapapeles (con reserva execCommand si el API no está disponible)
async function copyClipboard(text){
  try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(text);return true;}}catch(_){}

// ZIP (almacenado, sin compresión)
function zipStore(files){
  const chunks=[],central=[];let offset=0;
  files.forEach(f=>{
    const name=strBytes(f.name),data=f.data,crc=crc32(data);
    const lh=new Uint8Array(30+name.length),dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true);dv.setUint16(4,20,true);dv.setUint32(14,crc,true);dv.setUint32(18,data.length,true);dv.setUint32(22,data.length,true);dv.setUint16(26,name.length,true);lh.set(name,30);
    chunks.push(lh,data);
    const ch=new Uint8Array(46+name.length),cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint32(16,crc,true);cv.setUint32(20,data.length,true);cv.setUint32(24,data.length,true);cv.setUint16(28,name.length,true);cv.setUint32(42,offset,true);ch.set(name,46);
    central.push(ch);offset+=lh.length+data.length;
  });
  const centralSize=central.reduce((a,c)=>a+c.length,0);
  const end=new Uint8Array(22),ev=new DataView(end.buffer);
  ev.setUint32(0,0x06054b50,true);ev.setUint16(8,files.length,true);ev.setUint16(10,files.length,true);ev.setUint32(12,centralSize,true);ev.setUint32(16,offset,true);
  const parts=chunks.concat(central,[end]);
  const total=parts.reduce((a,p)=>a+p.length,0),out=new Uint8Array(total);let pos=0;parts.forEach(p=>{out.set(p,pos);pos+=p.length;});
  return out;
}

// Helpers OOXML
function xe(s){return nmu(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function wRun(text,o){o=o||{};const rpr=[];if(o.b)rpr.push('<w:b/>');if(o.i)rpr.push('<w:i/>');if(o.u)rpr.push('<w:u w:val="single"/>');if(o.color)rpr.push('<w:color w:val="'+o.color+'"/>');if(o.sz){rpr.push('<w:sz w:val="'+o.sz+'"/><w:szCs w:val="'+o.sz+'"/>');}

function wPara(content,o){o=o||{};const ppr=[];if(o.align)ppr.push('<w:jc w:val="'+o.align+'"/>');ppr.push('<w:spacing w:after="'+(o.after!=null?o.after:120)+'" w:line="259" w:lineRule="auto"/>');

    const pd=parseDataUrl(lo.src);if(!pd)continue;idx++;

    wPara([wRun(r.header.web||'',{sz:16,color:'0563C1',u:true})],{align:'right',after:0})

    +wCell((imgRuns.length?wPara(imgRuns,{after:0}):'<w:p/>'),5300,'center')
    +wCell(headerTextRuns,4338)+'</w:tr></w:tbl>';

  const header1='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<w:hdr xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">'+headerTbl+'<w:p/></w:hdr>';

  // Info principal

  pairs.forEach(p=>{if((p[1]||'').toString().trim()!=='')body.push(wLabelVal(p[0],p[1]));});

  const relsRoot='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>';
  const docRels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+rels.join('')+'</Relationships>';

let histStack=[],histLocs=[],histIdx=-1,histRestoring=false;const HIST_MAX=100;
function histSnap(){return JSON.stringify({p:S.projects,s:S.ph.samples,o:S.ph.options,pr:S.ph.presets,ex:S.ph.export,r:S.reports,rp:S.reportPresets,fb:S.feedback});}
function histLocSnap(){return {area:V.area,page:V.page,pid:V.pid,sid:V.sid,fpage:V.fpage,fsid:V.fsid,rpage:V.rpage,rid:V.rid};}
function histSeed(){histStack=[histSnap()];histLocs=[histLocSnap()];histIdx=0;updateUndoButtons();}
function histPush(){
  if(histRestoring)return;
  const snap=histSnap();
  if(histIdx>=0&&histStack[histIdx]===snap)return; // sin cambios de datos (navegación, tema, etc.)
  histStack=histStack.slice(0,histIdx+1);histLocs=histLocs.slice(0,histIdx+1);
  histStack.push(snap);histLocs.push(histLocSnap());
  if(histStack.length>HIST_MAX){histStack.shift();histLocs.shift();}
  histIdx=histStack.length-1;
  updateUndoButtons();
}
function histCanUndo(){return histIdx>0;}
function histCanRedo(){return histIdx<histStack.length-1;}
function areaLabel(a){return a==='projects'?'Proyectos':a==='phenotype'?'Fenotipos':a==='reports'?'Informes':'Dashboard';}
function locMatchesCurrent(loc){
  if(!loc||loc.area!==V.area)return false;
  if(loc.area==='projects')return (loc.page||'home')===(V.page||'home')&&loc.pid===V.pid;
  if(loc.area==='phenotype')return (loc.fpage||'home')===(V.fpage||'home')&&loc.fsid===V.fsid;
  if(loc.area==='reports')return (loc.rpage||'home')===(V.rpage||'home')&&loc.rid===V.rid;
  return true;
}
function applyLoc(loc){
  if(!loc)return;
  V.area=loc.area||'dashboard';S.area=V.area;V.sid=null;
  if(loc.area==='projects'){V.page=loc.page||'home';V.pid=loc.pid;if(loc.page==='proj'&&!proj(loc.pid)){V.page='home';V.pid=null;}else if(loc.sid&&proj(loc.pid)&&(proj(loc.pid).samples||[]).some(x=>x.id===loc.sid)){V.sid=loc.sid;}}
  else if(loc.area==='phenotype'){V.fpage=loc.fpage||'home';V.fsid=loc.fsid;if(loc.fpage==='sample'&&!phSample(loc.fsid)){V.fpage='home';V.fsid=null;}}
  else if(loc.area==='reports'){V.rpage=loc.rpage||'home';V.rid=loc.rid;if(loc.rpage==='edit'&&!S.reports.some(r=>r.id===loc.rid)){V.rpage='home';V.rid=null;}}
}
function histRestore(loc){
  histRestoring=true;
  const same=locMatchesCurrent(loc);
  const sc=document.getElementById('scroll');const top=(same&&sc)?sc.scrollTop:0;
  const wrap=document.querySelector('.mtx-wrap');const wl=(same&&wrap)?wrap.scrollLeft:0,wt=(same&&wrap)?wrap.scrollTop:0;
  try{const d=JSON.parse(histStack[histIdx]);
    S.projects=d.p||[];S.ph.samples=d.s||[];S.ph.options=d.o||[];S.ph.presets=d.pr||[];if(d.ex)S.ph.export=d.ex;S.reports=d.r||[];if(d.rp)S.reportPresets=d.rp;S.feedback=d.fb||[];
  }catch(_){}
  migrateProjects();phMigrate();reportMigrate();
  applyLoc(loc);
  try{localStorage.setItem(SK,JSON.stringify(S));}catch(_){}scheduleFileWrite();
  renderAll();updateFileBtn();updateFbBtn();
  if(V.sid)renderDrawer();else closeDrawer();
  if(same){const sc2=document.getElementById('scroll');if(sc2)sc2.scrollTop=top;const wrap2=document.querySelector('.mtx-wrap');if(wrap2){wrap2.scrollLeft=wl;wrap2.scrollTop=wt;}}
  histRestoring=false;updateUndoButtons();
}
function undo(){if(!histCanUndo())return;const loc=histLocs[histIdx];histIdx--;histRestore(loc);toast('Deshecho · '+areaLabel(V.area),{icon:'undo'});}
function redo(){if(!histCanRedo())return;histIdx++;const loc=histLocs[histIdx];histRestore(loc);toast('Rehecho · '+areaLabel(V.area),{icon:'redo'});}
function updateUndoButtons(){
  const u=document.getElementById('undoBtn'),r=document.getElementById('redoBtn');
  if(u){u.innerHTML=ic('undo',20);u.disabled=!histCanUndo();u.style.opacity=histCanUndo()?'':'.35';u.style.cursor=histCanUndo()?'':'default';}
  if(r){r.innerHTML=ic('redo',20);r.disabled=!histCanRedo();r.style.opacity=histCanRedo()?'':'.35';r.style.cursor=histCanRedo()?'':'default';}
}
document.addEventListener('keydown',e=>{
  if(!(e.ctrlKey||e.metaKey))return;
  const typing=/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement&&document.activeElement.tagName||'');
  if(typing)return; // deja el deshacer nativo del campo de texto
  const k=e.key.toLowerCase();
  if(k==='z'&&!e.shiftKey){e.preventDefault();undo();}
  else if(k==='y'||(k==='z'&&e.shiftKey)){e.preventDefault();redo();}
});

let bkTimer=null;const BK_MAX=15,BK_MIN_GAP=6*60*60*1000; // 1 cada ≥6 h, máx 15
function bkSchedule(){clearTimeout(bkTimer);bkTimer=setTimeout(bkSnapshot,4000);}
function bkSnapshot(){
  try{
    if(!Array.isArray(S.backups))S.backups=[];
    const now=Date.now();const last=S.backups[0];
    const payload=JSON.stringify(combinedPayload());
    if(last){if(now-new Date(last.at).getTime()<BK_MIN_GAP)return;if(last.data===payload)return;}
    S.backups.unshift({id:uid(),at:new Date().toISOString(),data:payload});
    if(S.backups.length>BK_MAX)S.backups.length=BK_MAX;
    try{localStorage.setItem(SK,JSON.stringify(S));}catch(_){}
  }catch(_){}
}
function bkCountItems(data){try{const d=JSON.parse(data);return{p:(d.projects||[]).length,f:((d.phenotype&&d.phenotype.samples)||[]).length,r:(d.reports||[]).length};}catch(_){return{p:0,f:0,r:0};}}
function openBackups(){
  const list=(S.backups||[]);
  const rows=list.length?list.map(b=>{const c=bkCountItems(b.data);return `<div class="bk-item"><span class="mic" style="width:32px;height:32px;border-radius:9px;background:var(--acl);color:var(--act);display:flex;align-items:center;justify-content:center">${ic('history',17)}</span><div class="bk-main"><div class="bk-when">${fmtDate(b.at)}</div><div class="bk-meta">${c.p} proyecto(s) · ${c.f} fenotipo(s) · ${c.r} informe(s)</div></div><button class="btn btn-g sm" onclick="bkRestore('${b.id}')">${ic('rotate',14)} Restaurar</button><button class="sc-ibtn" title="Eliminar copia" onclick="bkDelete('${b.id}')">${ic('trash',16)}</button></div>`;}).join(''):'<div class="dl-empty">Aún no hay copias. Se crean solas al ir trabajando.</div>';
  openModalHTML(`<div class="modal" style="width:min(600px,96vw)">
    <div class="mtit"><span class="mtit-ic">${ic('history',19)}</span>Copias de seguridad</div>
    <p class="sub" style="margin-top:2px">Instantáneas automáticas guardadas en este equipo. Restaurar reemplaza los datos actuales (podrás deshacer con Ctrl+Z).</p>
    <div class="bk-list">${rows}</div>
    <div class="mact"><button class="btn btn-g sm" onclick="bkSnapshotNow()">${ic('plus',14)} Crear copia ahora</button><button class="btn btn-g sm" onclick="closeModal()">Cerrar</button></div>
  </div>`);
}
function bkSnapshotNow(){try{if(!Array.isArray(S.backups))S.backups=[];const payload=JSON.stringify(combinedPayload());S.backups.unshift({id:uid(),at:new Date().toISOString(),data:payload});if(S.backups.length>BK_MAX)S.backups.length=BK_MAX;try{localStorage.setItem(SK,JSON.stringify(S));}catch(_){}openBackups();toast('Copia creada',{icon:'circle-check'});}catch(_){}}
function bkRestore(id){const b=(S.backups||[]).find(x=>x.id===id);if(!b)return;if(!confirm('¿Restaurar esta copia? Los datos actuales se reemplazarán (podrás deshacer con Ctrl+Z).'))return;try{const keepBk=S.backups;applyCombined(JSON.parse(b.data));S.backups=keepBk;save();renderAll();updateFileBtn();updateFbBtn();closeModal();toast('Copia restaurada',{icon:'rotate'});}catch(_){toast('No se pudo restaurar',{icon:'alert'});}}
function bkDelete(id){S.backups=(S.backups||[]).filter(x=>x.id!==id);try{localStorage.setItem(SK,JSON.stringify(S));}catch(_){}openBackups();}

function searchAll(q){
  q=(q||'').trim().toLowerCase();if(!q)return[];
  const out=[];
  S.projects.forEach(p=>{
    if((p.name||'').toLowerCase().includes(q))out.push({type:'Proyecto',icon:'folders',t:p.name,s:(p.samples||[]).length+' muestras',run:()=>openProj(p.id)});
    (p.samples||[]).forEach(s=>{if(s.code.toLowerCase().includes(q)||(s.desc||'').toLowerCase().includes(q))out.push({type:'Muestra',icon:'tube',t:s.code,s:(s.desc||p.name),run:()=>openSampleFrom(p.id,s.id)});});
  });
  S.ph.samples.forEach(s=>{if((s.title||'').toLowerCase().includes(q)||(s.desc||'').toLowerCase().includes(q))out.push({type:'Fenotipo',icon:'flask',t:s.title||'Sin título',s:s.populations.length+' poblaciones',run:()=>gotoPheno(s.id)});});
  (S.reports||[]).forEach(r=>{const i=r.info||{};if([r.name,i.idPaciente,i.nEstudio,i.nInforme,i.solicitante].some(x=>(x||'').toString().toLowerCase().includes(q)))out.push({type:'Informe',icon:'report',t:r.name||'Sin título',s:i.idPaciente||i.nEstudio||'',run:()=>rOpen(r.id)});});
  return out.slice(0,40);
}

function openPalette(){
  document.getElementById('mroot');
  const root=document.getElementById('palRoot')||(()=>{const d=document.createElement('div');d.id='palRoot';document.body.appendChild(d);return d;})();
  root.innerHTML=`<div class="pal-ov" onmousedown="if(event.target===this)closePalette()"><div class="pal">

    <div class="pal-list" id="palList"></div>
  </div></div>`;
  const inp=document.getElementById('palInp');

function renderPalette(){
  const inp=document.getElementById('palInp');const list=document.getElementById('palList');if(!inp||!list)return;
  const q=inp.value.trim().toLowerCase();
  const cmds=paletteCommands().filter(c=>!q||c.t.toLowerCase().includes(q)||c.g.toLowerCase().includes(q)).map(c=>({...c,kind:'cmd'}));
  const results=q?searchAll(q).map(r=>({g:r.type,t:r.t,sub:r.s,icon:r.icon,run:()=>{closePalette();r.run();},kind:'res'})):[];
  palItems=[...cmds,...results];palSel=palItems.length?0:-1;
  if(!palItems.length){list.innerHTML='<div class="pal-empty">Sin coincidencias</div>';return;}
  let html='',lastG=null;
  palItems.forEach((it,i)=>{const g=it.kind==='res'?('Resultados · '+it.g):it.g;if(g!==lastG){html+=`<div class="pal-grp">${esc(g)}</div>`;lastG=g;}
    html+=`<div class="pal-item${i===palSel?' sel':''}" data-i="${i}" onmousemove="palHover(${i})" onmousedown="event.preventDefault();palRun(${i})">${ic(it.icon,18)}<span class="pal-t">${esc(it.t)}${it.sub?` <span class="pal-sub">· ${esc(it.sub)}</span>`:''}</span></div>`;});
  list.innerHTML=html;
}
function palHover(i){palSel=i;document.querySelectorAll('#palList .pal-item').forEach(el=>el.classList.toggle('sel',+el.dataset.i===i));}
function palRun(i){const it=palItems[i];if(it&&it.run)it.run();}
function palKey(e){
  if(e.key==='ArrowDown'){e.preventDefault();palSel=Math.min(palItems.length-1,palSel+1);palSync();}
  else if(e.key==='ArrowUp'){e.preventDefault();palSel=Math.max(0,palSel-1);palSync();}
  else if(e.key==='Enter'){e.preventDefault();palRun(palSel);}
  else if(e.key==='Escape'){e.preventDefault();closePalette();}
}
function palSync(){const els=document.querySelectorAll('#palList .pal-item');els.forEach(el=>el.classList.toggle('sel',+el.dataset.i===palSel));const sel=els[palSel];if(sel)sel.scrollIntoView({block:'nearest'});}

    ['Buscar / paleta de comandos',['Ctrl','K']],['Enfocar búsqueda',['/']],

    ['Guardar en archivo',['Ctrl','S']],['Nuevo (según contexto)',['N']],
    ['Cambiar tema',['T']],['Aumentar zoom',['Ctrl','+']],
    ['Reducir zoom',['Ctrl','−']],['Restablecer zoom',['Ctrl','0']],
    ['Esta ayuda',['?']],['Cerrar / cancelar',['Esc']]
  ];
  openModalHTML(`<div class="modal" style="width:min(620px,96vw)">
    <div class="mtit"><span class="mtit-ic">${ic('info',19)}</span>Atajos de teclado</div>
    <div class="ks-grid">${rows.map(r=>`<div class="ks-row"><span>${r[0]}</span><span class="ks-keys">${r[1].map(k=>`<kbd>${k}</kbd>`).join('')}</span></div>`).join('')}</div>
    <div class="mact"><button class="btn btn-g sm" onclick="closeModal()">Cerrar</button></div>
  </div>`);
}

/* ── Fechas objetivo / avisos ── */
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function daysUntil(due){if(!due)return null;const a=new Date(due+'T00:00:00'),b=new Date(todayStr()+'T00:00:00');return Math.round((a-b)/864e5);}
function dueInfo(s,p){
  if(!s||!s.due)return null;
  const tot=totalSt(p),done=progress(s,p),complete=tot>0&&done===tot;
  const d=daysUntil(s.due);
  const dd=new Date(s.due+'T00:00:00').toLocaleDateString('es-ES',{day:'2-digit',month:'short'});
  if(complete)return{cls:'due-done',txt:'Entregada',d,due:s.due};
  if(d<0)return{cls:'due-over',txt:'Vencida '+dd,d,due:s.due};
  if(d===0)return{cls:'due-soon',txt:'Hoy',d,due:s.due};
  if(d<=7)return{cls:'due-soon',txt:'En '+d+' d ('+dd+')',d,due:s.due};
  return{cls:'due-ok',txt:dd,d,due:s.due};
}
function dueBadge(s,p){const di=dueInfo(s,p);if(!di)return'';return `<span class="due-badge ${di.cls}" title="Fecha objetivo">${ic('calendar-check',12)} ${di.txt}</span>`;}
function allDueSoon(){
  const out=[];
  S.projects.forEach(p=>{const tot=totalSt(p);(p.samples||[]).forEach(s=>{if(!s.due)return;const done=progress(s,p);if(tot>0&&done===tot)return;const d=daysUntil(s.due);out.push({pid:p.id,sid:s.id,code:s.code,pname:p.name,color:p.color,due:s.due,d});});});
  out.sort((a,b)=>a.d-b.d);
  return out;
}

/* ── Vista Todas las muestras (entre proyectos) ── */
function openAllSamples(){V.area='projects';S.area='projects';V.page='all';V.pid=null;V.sid=null;save();closeDrawer();if(isMobile()&&!S.sideOff){S.sideOff=true;applySide();}renderAll();}
function renderAllSamples(c){
  const q=(V.allq||'').toLowerCase(),f=V.allfilter||'all';
  let rows=[];
  S.projects.forEach(p=>{const tot=totalSt(p);(p.samples||[]).forEach(s=>{const done=progress(s,p),pct=tot>0?Math.round(done/tot*100):0;const st=tot>0&&done===tot?'done':done>0?'prog':'pend';rows.push({p,s,tot,done,pct,st});});});
  let list=rows.filter(r=>r.s.code.toLowerCase().includes(q)||(r.s.desc||'').toLowerCase().includes(q)||r.p.name.toLowerCase().includes(q));
  if(f!=='all')list=list.filter(r=>r.st===f);
  const so=V.allsort||'recent';
  if(so==='code')list.sort((a,b)=>a.s.code.localeCompare(b.s.code,'es',{numeric:true}));
  else if(so==='progress')list.sort((a,b)=>b.pct-a.pct);
  else if(so==='due')list.sort((a,b)=>{const da=a.s.due?daysUntil(a.s.due):9e9,db=b.s.due?daysUntil(b.s.due):9e9;return da-db;});
  else list.sort((a,b)=>(lastActivity(b.s)||'').localeCompare(lastActivity(a.s)||''));
  const seg=['all','Todas','done','Completas','prog','En progreso','pend','Pendientes'].reduce((acc,_,i,arr)=>{if(i%2)return acc;const k=arr[i],l=arr[i+1];return acc+`<button class="seg-btn${f===k?' on':''}" onclick="V.allfilter='${k}';refreshAll()">${l}</button>`;},'');
  const cards=list.length?list.map(({p,s,tot,done,pct,st})=>{
    const badge=st==='done'?'<span class="badge b-done">Completa</span>':st==='prog'?'<span class="badge b-prog">En progreso</span>':'<span class="badge b-pend">Pendiente</span>';
    return `<div class="scard" onclick="openSampleFrom('${p.id}','${s.id}')">
      <div class="sc-top"><div class="sc-info">
        <div class="sc-hd"><span class="sc-code">${esc(s.code)}</span>${badge}${dueBadge(s,p)}</div>
        <div class="sc-desc">${esc(s.desc||'Sin descripción')}</div>
        <div class="sc-meta"><span class="all-proj-chip"><span class="pdot" style="background:${p.color}"></span>${esc(p.name)}</span><span style="opacity:.4">·</span>${ic('list-check',15)}<b>${done}</b>/${tot} etapas</div>
      </div>${ring(pct,68,7)}</div></div>`;
  }).join(''):`<div class="empty"><div class="empty-ic">${ic('flask-off',40)}</div><h3>Sin muestras</h3><p>No hay muestras que coincidan.</p></div>`;
  c.innerHTML=`<div class="wrap">
    <div class="crumb" style="margin-bottom:14px"><button class="crumb-link" onclick="goHome()">${ic('home',18)} Inicio</button><span style="color:var(--tx3)">/</span><span style="color:var(--tx2)">Todas las muestras</span></div>
    <div class="phead"><span class="phead-dot" style="background:var(--ac)"></span><h1>Todas las muestras</h1></div>
    <div class="sub-line">${rows.length} muestras en ${S.projects.length} proyecto(s)</div>
    <div class="controls">
      <div class="srch-w">${ic('search',18)}<input class="srch" id="allsrch" type="text" placeholder="Buscar por código, descripción o proyecto…" value="${esc(V.allq||'')}" oninput="V.allq=this.value;refreshAll()"></div>
      <select class="sel" onchange="V.allsort=this.value;refreshAll()">
        <option value="recent"${so==='recent'?' selected':''}>Más recientes</option>
        <option value="code"${so==='code'?' selected':''}>Código (A-Z)</option>
        <option value="progress"${so==='progress'?' selected':''}>Más avanzadas</option>
        <option value="due"${so==='due'?' selected':''}>Fecha objetivo</option>
      </select>
    </div>
    <div class="controls"><div class="seg">${seg}</div></div>
    <div class="scards">${cards}</div>
  </div>`;
  const si=document.getElementById('allsrch');if(si){si.focus();si.setSelectionRange(si.value.length,si.value.length);}
}
function refreshAll(){const c=scrollEl();if(!c||V.page!=='all'||V.area!=='projects')return;const t=c.scrollTop;renderAllSamples(c);c.scrollTop=t;}

/* ── Drag & drop en el flujo ── */
let dndData=null;
function initFlowDnD(){
  const wrap=document.getElementById('flowWrap');if(!wrap)return;
  wrap.querySelectorAll('.fnode').forEach(n=>{
    n.setAttribute('draggable','true');
    n.addEventListener('dragstart',e=>{dndData={kind:'step',pid:n.dataset.pid,id:n.dataset.nid};n.classList.add('dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain','s');}catch(_){}});
    n.addEventListener('dragend',()=>{n.classList.remove('dragging');dndData=null;wrap.querySelectorAll('.dragover').forEach(x=>x.classList.remove('dragover'));});
    const col=n.closest('.flow-col');
    if(col){col.addEventListener('dragover',e=>{if(dndData&&dndData.kind==='step'){e.preventDefault();col.classList.add('dragover');}});
      col.addEventListener('dragleave',()=>col.classList.remove('dragover'));
      col.addEventListener('drop',e=>{if(!dndData||dndData.kind!=='step')return;e.preventDefault();col.classList.remove('dragover');dropStep(dndData.pid,dndData.id,n.dataset.nid);});}
  });
  wrap.querySelectorAll('.fbnode').forEach(n=>{
    n.setAttribute('draggable','true');
    n.addEventListener('dragstart',e=>{e.stopPropagation();dndData={kind:'branch',pid:n.dataset.pid,sid:n.dataset.sid,id:n.dataset.bid};n.classList.add('dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain','b');}catch(_){}});
    n.addEventListener('dragend',()=>{n.classList.remove('dragging');dndData=null;wrap.querySelectorAll('.dragover').forEach(x=>x.classList.remove('dragover'));});
    n.addEventListener('dragover',e=>{if(dndData&&dndData.kind==='branch'&&dndData.sid===n.dataset.sid){e.preventDefault();e.stopPropagation();n.classList.add('dragover');}});
    n.addEventListener('dragleave',()=>n.classList.remove('dragover'));
    n.addEventListener('drop',e=>{if(!dndData||dndData.kind!=='branch'||dndData.sid!==n.dataset.sid)return;e.preventDefault();e.stopPropagation();n.classList.remove('dragover');dropBranch(dndData.pid,dndData.sid,dndData.id,n.dataset.bid);});
  });
}
function dropStep(pid,fromId,toId){if(fromId===toId)return;const p=proj(pid);if(!p)return;const arr=p.steps,i=arr.findIndex(x=>x.id===fromId),j=arr.findIndex(x=>x.id===toId);if(i<0||j<0)return;const[m]=arr.splice(i,1);arr.splice(j,0,m);save();refreshFlow();}
function dropBranch(pid,sid,fromId,toId){if(fromId===toId)return;const p=proj(pid);if(!p)return;const st=(p.steps||[]).find(x=>x.id===sid);if(!st)return;const arr=st.branches,i=arr.findIndex(x=>x.id===fromId),j=arr.findIndex(x=>x.id===toId);if(i<0||j<0)return;const[m]=arr.splice(i,1);arr.splice(j,0,m);save();refreshFlow();}

/* ── Impresión / PDF del flujo y de la matriz ── */
function printRootEl(){let r=document.getElementById('printRoot');if(!r){r=document.createElement('div');r.id='printRoot';document.body.appendChild(r);}return r;}
function doPrint(html){const r=printRootEl();r.innerHTML=`<div style="font-family:'Plus Jakarta Sans',Segoe UI,sans-serif;color:#111;padding:24px">${html}</div>`;const prevZoom=document.documentElement.style.zoom;document.documentElement.style.zoom='1';setTimeout(()=>{window.print();document.documentElement.style.zoom=prevZoom;setTimeout(()=>{r.innerHTML='';},400);},60);}
function printFlow(pid){
  const p=proj(pid);if(!p)return;const sm=p.samples||[];
  const steps=(p.steps||[]).map((s,i)=>{const vc=sm.filter(x=>x.validations&&x.validations[s.id]).length;const pct=sm.length?Math.round(vc/sm.length*100):0;
    const br=(s.branches||[]).map(b=>{const bvc=sm.filter(x=>x.validations&&x.validations[b.id]).length;return `<div style="margin:3px 0 3px 26px;font-size:13px;color:#444">↳ ${esc(b.name)} — ${bvc}/${sm.length} validadas</div>`;}).join('');
    return `<div style="border:1px solid #ccc;border-radius:8px;padding:10px 13px;margin-bottom:8px"><div style="font-weight:700">${i+1}. ${esc(s.name)}</div><div style="font-size:13px;color:#555">${vc}/${sm.length} muestras validadas (${pct}%)</div>${br}</div>`;}).join('');
  doPrint(`<h1 style="font-size:22px;margin-bottom:4px">${esc(p.name)}</h1><div style="color:#555;margin-bottom:18px">Flujo de trabajo · ${sm.length} muestras · ${(p.steps||[]).length} etapas · impreso ${new Date().toLocaleDateString('es-ES')}</div>${steps||'<p>Sin etapas.</p>'}`);
}
function phPrintMatrix(sid){
  const s=phSample(sid);if(!s)return;
  const cls=phClassifySample(s);const markers=s.markers;
  const th=markers.map(m=>`<th style="border:1px solid #ccc;padding:5px 7px;font-size:11px;${cls[m.id]==='diff'?'background:#efeaff':''}">${esc(m.name)}</th>`).join('');
  const body=s.populations.map(p=>`<tr><td style="border:1px solid #ccc;padding:5px 7px;font-weight:600">${esc(p.title)}</td>${markers.map(m=>{const o=S.ph.options.find(x=>x.id===p.values[m.id]);return `<td style="border:1px solid #ccc;padding:5px 7px;text-align:center;font-size:12px;${o?'background:'+o.color+';color:'+textColor(o.color):''}">${o?esc(o.label):'·'}</td>`;}).join('')}</tr>`).join('');
  doPrint(`<h1 style="font-size:22px;margin-bottom:4px">${esc(s.title||'Fenotipo')}</h1><div style="color:#555;margin-bottom:16px">${s.populations.length} poblaciones · ${markers.length} marcadores · impreso ${new Date().toLocaleDateString('es-ES')}</div><table style="border-collapse:collapse;width:100%"><thead><tr><th style="border:1px solid #ccc;padding:5px 7px">Población</th>${th}</tr></thead><tbody>${body}</tbody></table>`);
}

/* ── Cableado de eventos globales ── */
(function wireUI(){
  const g=document.getElementById('gsrch');
  if(g){
    g.addEventListener('input',renderGlobalResults);
    g.addEventListener('focus',()=>{if(g.value.trim())renderGlobalResults();});
    g.addEventListener('blur',()=>setTimeout(closeGRes,150));
    g.addEventListener('keydown',e=>{
      const box=document.getElementById('gres');const open=box&&box.classList.contains('show')&&gResults.length;
      if(e.key==='ArrowDown'&&open){e.preventDefault();gSel=Math.min(gResults.length-1,gSel+1);gHover(gSel);const el=document.querySelector('#gres .gres-item.sel');if(el)el.scrollIntoView({block:'nearest'});}
      else if(e.key==='ArrowUp'&&open){e.preventDefault();gSel=Math.max(0,gSel-1);gHover(gSel);const el=document.querySelector('#gres .gres-item.sel');if(el)el.scrollIntoView({block:'nearest'});}
      else if(e.key==='Enter'){e.preventDefault();if(open&&gSel>=0)gPick(gSel);else legacyGlobalSearch(g.value);}
      else if(e.key==='Escape'){closeGRes();g.blur();}
    });
  }
  document.addEventListener('keydown',e=>{
    const typing=/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement&&document.activeElement.tagName||'');
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(document.getElementById('palRoot')&&document.getElementById('palRoot').innerHTML)closePalette();else openPalette();return;}
    if((e.ctrlKey||e.metaKey)&&(e.key==='+'||e.key==='=')){e.preventDefault();zoomStep(1);return;}
    if((e.ctrlKey||e.metaKey)&&(e.key==='-'||e.key==='_')){e.preventDefault();zoomStep(-1);return;}
    if((e.ctrlKey||e.metaKey)&&e.key==='0'){e.preventDefault();zoomReset();return;}
    if(e.key==='?'&&!typing&&!(e.ctrlKey||e.metaKey)){if(document.getElementById('mroot').innerHTML)return;e.preventDefault();openShortcuts();}
  });
})();
function legacyGlobalSearch(val){const q=(val||'').trim().toLowerCase();if(!q)return;const res=searchAll(q);if(res.length){closeGRes();document.getElementById('gsrch').blur();res[0].run();}else toast('Sin resultados para “'+val+'”',{icon:'search-off'});}

/* ════════ INIT ════════ */
function hideAppLoader(){const l=document.getElementById('appLoader');if(!l)return;l.classList.add('hide');setTimeout(()=>{if(l.parentNode)l.parentNode.removeChild(l);},450);}
function runAppLoader(){const l=document.getElementById('appLoader');if(!l)return;if(S.showLoader===false){l.parentNode&&l.parentNode.removeChild(l);return;}setTimeout(hideAppLoader,1500);}
load();
(async()=>{
  runAppLoader();
  try{await restoreFileLink();}catch(_){}
  V.area=S.area||'dashboard';
  if(V.area==='projects'&&S.lastPid&&proj(S.lastPid)){V.page='proj';V.pid=S.lastPid;}
  if(V.area==='phenotype'&&S.lastFsid&&phSample(S.lastFsid)){V.fpage='sample';V.fsid=S.lastFsid;}
  if(V.area==='reports'&&S.lastRid&&S.reports.some(r=>r.id===S.lastRid)){V.rpage='edit';V.rid=S.lastRid;}
  renderAll();updateFileBtn();updateFbBtn();
  histSeed();
  // Recordatorio de sincronización con el archivo de respaldo al abrir (configurable)
  if(fileSupported&&S.syncReminder!==false){const delay=(S.showLoader===false)?300:1700;setTimeout(()=>{if(!document.getElementById('mroot').innerHTML)fileDialog();},delay);}
})();
