  --shadow-hover:0 12px 30px -10px rgba(16,24,40,.20);
  --shadow-pop:0 26px 64px -14px rgba(16,24,40,.30);
}
[data-theme=dark]{--bg:#0A0D12;--sf:#12171F;--sf2:#191F29;--sf3:#212936;--sf-hi:#151B24;--bd:#212936;--bd2:#2B3444;--bd3:#3A4557}

/* Barra superior con efecto cristal */
.bar{background:color-mix(in srgb,var(--sf) 84%,transparent);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px)}
.logo-chip{border-radius:13px;box-shadow:0 5px 16px -4px rgba(13,134,118,.5)}
.gsrch input{border-radius:12px}
.gsrch input:focus{box-shadow:0 0 0 3px var(--foc)}
.pill-btn{border-radius:12px;font-weight:600}

/* Navegación lateral con indicador */
.nav-item{border-radius:12px;font-weight:600}
.nav-item.on{background:linear-gradient(100deg,var(--sb-on),transparent 170%);box-shadow:inset 3px 0 0 var(--ac)}
.new-btn{border-radius:13px;box-shadow:0 7px 20px -7px rgba(13,134,118,.65)}
.pitem,.sitem{border-radius:11px}
.pitem.on,.sitem.on{box-shadow:inset 3px 0 0 var(--ac)}
.foot-btn{border-radius:11px;font-weight:600}

/* Superficies */
.stat,.pcard,.scard,.rp-card,.act-item,.opt-row,.pick-col,.modal{border-radius:var(--r-m)}
.stat-ic,.sec-ico,.mtit-ic{border-radius:13px}
.stat-v,h1.title,.hero h1{letter-spacing:-.9px}
.btn{border-radius:11px}
.btn-p{box-shadow:0 5px 16px -6px rgba(13,134,118,.6)}
.minp,.minput,.txt-in,.sel,.srch{border-radius:11px}
.toast{border-radius:14px}
::-webkit-scrollbar-thumb{border-radius:8px}

/* ── FENOTIPOS: más visual e intuitivo ── */
/* Filas alternas y realce de la fila activa */
.ph-area .mtx tbody tr:nth-child(even) td.cell{background:color-mix(in srgb,var(--sf2) 55%,transparent)}
.ph-area .mtx tbody tr:nth-child(even) .pop-th{background:var(--sf-hi)}
.ph-area .mtx tbody tr:hover td.cell{background:color-mix(in srgb,var(--acl) 60%,transparent)}
.ph-area .mtx tbody tr:hover .pop-th{background:var(--acl);box-shadow:-16px 0 0 var(--acl),inset 3px 0 0 var(--ac)}
.ph-area .mtx tbody tr:hover td.cell.diff{background:color-mix(in srgb,var(--acl) 60%,transparent)}
/* Celdas de expresión con relieve */
.ph-area .cell-sel{box-shadow:0 1px 2px rgba(16,24,40,.16),inset 0 1px 0 rgba(255,255,255,.25);border:none;font-weight:700}
.ph-area .cell-sel:hover{filter:brightness(1.07);transform:translateY(-1px);box-shadow:0 4px 10px -2px rgba(16,24,40,.24)}
.ph-area .cell-sel:focus{box-shadow:0 0 0 3px var(--foc)}
/* Columna de población separada del cuerpo */
.ph-area .pop-th{border-right:2px solid var(--bd2)}
.ph-area .pop-unit{font-size:9.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--tx3)}
.ph-area .pop-id,.ph-area .pop-num,.ph-area .pop-comment{border-radius:8px}
/* Pie de estadísticas fijo y legible */
.ph-area .mtx tfoot{position:sticky;bottom:0;z-index:2}
.ph-area .mtx tfoot th,.ph-area .mtx tfoot td{background:var(--sf2)}
.ph-area .mtx tfoot tr:first-child th,.ph-area .mtx tfoot tr:first-child td{border-top:2px solid var(--bd2)}
.ph-area .mtx-stat th.corner{font-size:11px;font-weight:800;box-shadow:-16px 0 0 var(--sf2)}
.ph-area .mtx-stat td.mk-stat{font-size:12.5px;font-weight:800}
/* Marcador destacado al pasar el cursor por su columna */
.ph-area .mk-th:hover .mk-chip{transform:translateY(-1px);box-shadow:0 6px 16px -6px rgba(16,24,40,.3)}
.ph-area .mk-chip{transition:transform .14s var(--ease),box-shadow .16s var(--ease),background-color .18s var(--ease)}
/* Píldoras de la barra de detección */
.ph-area .auto-pill.diff{box-shadow:0 4px 12px -4px rgba(124,92,255,.55)}
.ph-area .legend .sw{width:15px;height:15px;border-radius:5px}

/* ════════════════════════════════════════════════════════════
   FENOTIPOS v1.15 — columna de población ordenada y matriz nítida
   ════════════════════════════════════════════════════════════ */
/* Unidades: sin mayúsculas forzadas (evita "CÉL/ML") y sin partirse */
.ph-area .pop-unit,.pop-unit{text-transform:none;white-space:nowrap;font-size:10.5px;font-weight:600;color:var(--tx3);letter-spacing:0}

/* Columna de población: bloque limpio y compacto */
.ph-area .pop-th{min-width:270px}
.ph-area .pop-cell{gap:5px;padding:9px 12px 10px 12px;max-width:100%;overflow:hidden}
.ph-area .pop-in-wrap{gap:2px;padding-right:4px;min-width:0}
.ph-area .pop-in{width:100%;min-width:0;font-size:14px;font-weight:700;letter-spacing:-.2px;padding:4px 8px;border:1px solid transparent;border-radius:8px}
.ph-area .pop-in:hover{background:var(--sf2)}
.ph-area .pop-in:focus{background:var(--sf);border-color:var(--ac);outline:none}
/* Fila de metadatos alineada en rejilla */
.ph-area .pop-meta{display:grid;grid-template-columns:auto 1fr auto 1fr auto;align-items:center;gap:5px;padding-left:8px}
.ph-area .pop-meta .pop-id{width:100%;min-width:0;grid-column:1/-1;margin-bottom:2px;font-weight:600}
.ph-area .pop-meta .pop-num{width:100%;min-width:0;text-align:right;font-variant-numeric:tabular-nums;padding:4px 6px}
.ph-area .pop-comment{width:calc(100% - 8px);margin-left:8px;min-height:26px;font-size:11.5px;background:transparent;border-style:dashed;color:var(--tx2)}
.ph-area .pop-comment:hover{background:var(--sf2);border-style:solid}
.ph-area .pop-comment:focus{background:var(--sf);border-style:solid}
.ph-area .pop-comment::placeholder{font-style:italic}
/* Acciones de fila: siempre alineadas a la derecha del título */
.ph-area .pop-mv,.ph-area .pop-del{flex-shrink:0}

/* Cabecera de marcadores: chips más nítidos */
.ph-area .mtx .mk-th{min-width:92px;padding:9px 5px}
.ph-area .mk-chip{background:var(--sf2);border:1px solid var(--bd);box-shadow:none}
.ph-area .mk-chip.common{background:var(--common-bg);border-color:transparent}
.ph-area .mk-chip.diff{background:var(--diff-solid);border-color:transparent;box-shadow:0 5px 14px -5px rgba(124,92,255,.7)}
.ph-area .mk-in{font-size:12.5px;font-weight:750;text-align:center}
.ph-area .mtx thead th{border-bottom:1px solid var(--bd2)}

/* Celdas: algo más compactas y con tipografía clara */
.ph-area .cell-sel{height:34px;font-size:13px;border-radius:9px}
.ph-area .mtx td.cell{padding:3px}

/* Estadísticas del pie: etiqueta con acento de color */
.ph-area .mtx-stat th.corner{padding:7px 12px;font-size:11.5px;font-weight:750;border-left:3px solid transparent}
.ph-area .mtx-stat th.corner.st-pos{border-left-color:#16a34a}
.ph-area .mtx-stat th.corner.st-neg{border-left-color:var(--dg)}
.ph-area .mtx-stat th.corner.st-het{border-left-color:var(--violet)}
.ph-area .mtx-stat td.mk-stat{padding:7px 6px;font-variant-numeric:tabular-nums}
.ph-area .mtx tfoot tr:not(:first-child) th,.ph-area .mtx tfoot tr:not(:first-child) td{border-top:1px solid var(--grid)}

/* Contenedor de la matriz */
.ph-area .mtx-wrap{padding:0;border:1px solid var(--bd);box-shadow:var(--shadow-card)}
.ph-area .mtx{border-collapse:separate;border-spacing:0}

/* ── Entorno general: más definición ── */
.wrap{max-width:1240px}
.section{margin-bottom:30px}
.sec-hd h2{letter-spacing:-.4px}
.toolbar,.legend,.auto-bar,.mtx-sort{border-color:var(--bd)}
.empty-ic{border-radius:22px}
.tip{border-radius:var(--r-m)}
.drawer{border-left:1px solid var(--bd)}
.modal{border-radius:var(--r-l)}
.act-item:hover,.due-item:hover{box-shadow:var(--shadow-hover)}
.badge{font-weight:700}
</style>
</head>
<body>
<div id="appLoader"><div class="ld-chip"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4c0 6 14 8 14 16"/><path d="M19 4c0 6-14 8-14 16"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="9.5" y1="11" x2="14.5" y2="11"/><line x1="9.5" y1="13.5" x2="14.5" y2="13.5"/><line x1="8" y1="17.5" x2="16" y2="17.5"/></svg></div><div class="ld-name">BioFlow</div><div class="ld-bar"><i></i></div></div>
<div id="tip" class="tip"></div>

<div id="app">
  <header class="bar">
    <button class="icon-btn" onclick="toggleSide()" title="Mostrar u ocultar el panel" aria-label="Panel">
      <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
    </button>
    <button class="logo" onclick="goDashboard()" title="Ir al dashboard">
      <span class="logo-chip"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4c0 6 14 8 14 16"/><path d="M19 4c0 6-14 8-14 16"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="9.5" y1="11" x2="14.5" y2="11"/><line x1="9.5" y1="13.5" x2="14.5" y2="13.5"/><line x1="8" y1="17.5" x2="16" y2="17.5"/></svg></span>
      <span class="logo-txt">BioFlow<sup>LAB</sup></span>
    </button>
    <button class="icon-btn" id="undoBtn" onclick="undo()" title="Deshacer (Ctrl+Z)" aria-label="Deshacer"></button>
    <button class="icon-btn" id="redoBtn" onclick="redo()" title="Rehacer (Ctrl+Y)" aria-label="Rehacer"></button>
    <div class="bar-sp"></div>
    <div class="gsrch">
      <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="gsrch" type="text" placeholder="Buscar…  (Ctrl+K)" autocomplete="off">
      <div class="gres" id="gres"></div>
    </div>
    <div class="zoom-ctl" title="Escala de la interfaz (Ctrl -/+, Ctrl+0 restablece)">
      <button onclick="zoomStep(-1)" title="Reducir (Ctrl -)" aria-label="Reducir zoom"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
      <button class="zoom-val" id="zoomVal" onclick="zoomReset()" title="Restablecer al 100% (Ctrl+0)">100%</button>
      <button onclick="zoomStep(1)" title="Aumentar (Ctrl +)" aria-label="Aumentar zoom"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
    </div>
    <div class="save-ind local" id="saveInd" title="Estado de guardado"><span class="dot"></span><span class="txt">Local</span></div>
    <button class="pill-btn" id="fbBtn" onclick="openFeedback()" title="Comentarios: bugs y mejoras"></button>
    <button class="pill-btn" id="fileBtn" onclick="fileBtnClick()" title="Vincular un archivo de la carpeta para guardar/cargar automáticamente"></button>
    <button class="pill-btn" id="thBtn" onclick="toggleTheme()"></button>
    <div class="bar-more-wrap" id="barMoreWrap">
      <button class="icon-btn" id="barMore" onclick="toggleBarMenu(event)" title="Más opciones" aria-label="Más opciones"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></button>
      <div class="bar-menu" id="barMenu">
        <button onclick="openFeedback();closeBarMenu()"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2z"/></svg><span>Comentarios</span><span class="bar-menu-n" id="fbMenuN"></span></button>
        <button onclick="fileBtnClick();closeBarMenu()"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 14.5l5-5"/><path d="M11 7l1.2-1.2a3.7 3.7 0 0 1 5.2 5.2L16.2 12"/><path d="M13 17l-1.2 1.2a3.7 3.7 0 0 1-5.2-5.2L7.8 12"/></svg><span>Vincular archivo</span></button>
        <button onclick="toggleTheme();closeBarMenu()"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg><span>Cambiar tema</span></button>
      </div>
    </div>
  </header>
  <div class="app">
    <nav class="side" id="side" aria-label="Navegación">
      <div class="side-in" id="sideIn"></div>
    </nav>
    <div class="backdrop" id="backdrop" onclick="toggleSide()"></div>
    <main class="main"><div class="scroll" id="scroll"></div></main>
  </div>
  <div id="drawerRoot"></div>
  <div id="mroot"></div>
  <div class="toasts" id="toasts"></div>
  <input type="file" id="importFile" accept="application/json,.json" style="display:none" onchange="importData(event)">
</div>

<script>
/* ════════ ICONS (SVG inline, sin CDN) ════════ */
const ICONS={
  'menu':'<line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/>',
  'search':'<circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',

  try{const d=localStorage.getItem(SK);if(d){const p=JSON.parse(d);if(p&&typeof p==='object'){S=Object.assign(S,p);loaded=true;}}}catch(_){}
  if(!loaded){

    try{const ob=localStorage.getItem('bioflow6');if(ob){const p=JSON.parse(ob);if(p&&typeof p==='object'){if(Array.isArray(p.projects))S.projects=p.projects;if(p.theme)S.theme=p.theme;if(typeof p.sideOff==='boolean')S.sideOff=p.sideOff;}}}catch(_){}
    try{const of=localStorage.getItem('fenotipos1');if(of){const p=JSON.parse(of);if(p&&typeof p==='object'){S.ph={samples:Array.isArray(p.samples)?p.samples:[],options:Array.isArray(p.options)?p.options:[],presets:Array.isArray(p.presets)?p.presets:[]};}}}catch(_){}
  }
  if(typeof S.sideOff!=='boolean')S.sideOff=false;
  if(!S.theme)S.theme='light';
  if(!S.area)S.area='dashboard';
  if(typeof S.scale!=='number')S.scale=100;

  if(!Array.isArray(S.backups))S.backups=[];

}

function proj(id){return S.projects.find(x=>x.id===id);}
function uid(){return Math.random().toString(36).slice(2,9);}
function nmu(s){return String(s==null?'':s).replace(/μ/g,'µ');}
/* ── Nombres únicos por categoría: si ya existe, se añade número de copia " (2)", " (3)"… ── */
function uniqueName(name,existing,fallback){
  let nm=nmu(name).trim()||nmu(fallback||'Sin título').trim();
  const set=new Set((existing||[]).map(x=>nmu(x).trim().toLowerCase()));
  if(!set.has(nm.toLowerCase()))return nm;
  const base=nm.replace(/\s*\(\d+\)\s*$/,'').trim()||nm;
  let n=2;while(set.has((base+' ('+n+')').toLowerCase()))n++;
  return base+' ('+n+')';
}
function projNames(exceptId){return S.projects.filter(p=>p.id!==exceptId).map(p=>p.name);}
function phNames(exceptId){return S.ph.samples.filter(x=>x.id!==exceptId).map(x=>x.title);}
function reportNames(exceptId){return (S.reports||[]).filter(r=>r.id!==exceptId).map(r=>r.name);}
function uniqToast(asked,got){if(nmu(asked).trim()!==got)toast('Ya existía ese nombre: se guardó como «'+got+'»',{icon:'info'});}
function esc(t){if(t==null)return'';return nmu(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtDate(iso){if(!iso)return'';try{return new Date(iso).toLocaleString('es-ES',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}catch(_){return iso;}}
function relTime(iso){
  if(!iso)return'';
  const diff=Date.now()-new Date(iso).getTime();
  const m=Math.round(diff/6e4),h=Math.round(diff/36e5),d=Math.round(diff/864e5);
  if(m<1)return'ahora';if(m<60)return`hace ${m} min`;if(h<24)return`hace ${h} h`;if(d<30)return`hace ${d} d`;
  return new Date(iso).toLocaleDateString('es-ES',{day:'2-digit',month:'short'});
}
function allSteps(p){const r=[];(p.steps||[]).forEach(s=>{r.push({...s,_br:false});(s.branches||[]).forEach(b=>r.push({...b,_br:true,_pid:s.id}));});return r;}
function progress(smp,p){return allSteps(p).filter(st=>smp.validations?.[st.id]).length;}
function totalSt(p){return allSteps(p).length;}
function lastActivity(s){const ds=Object.values(s.validations||{});if(!ds.length)return s.createdAt||'';return ds.sort().slice(-1)[0];}
function pctOf(s,p){const t=totalSt(p);return t>0?Math.round(progress(s,p)/t*100):0;}

function ring(pct,size,stroke){
  size=size||72;stroke=stroke||7;
  const r=(size-stroke)/2,c=+(2*Math.PI*r).toFixed(2),off=+(c*(1-Math.min(pct,100)/100)).toFixed(2);
  const col=pct>=100?'var(--teal-500)':'var(--teal-400)';
  return`<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--sf3)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})" style="transition:stroke-dashoffset .6s var(--ease)"/>
    <text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle" font-size="${Math.round(size*0.27)}" font-weight="800" fill="var(--tx)" font-family="inherit">${pct}<tspan font-size="${Math.round(size*0.16)}">%</tspan></text>
  </svg>`;
}

function toast(msg,opts={}){
  const cont=document.getElementById('toasts');
  const elx=document.createElement('div');elx.className='toast';
  elx.innerHTML=`<span class="lead">${ic(opts.icon||'info',19)}</span><span class="toast-msg">${esc(msg)}</span>`;
  if(opts.actionLabel){
    const b=document.createElement('button');b.className='toast-act';
    b.innerHTML=`${ic('undo',15)}${esc(opts.actionLabel)}`;
    b.onclick=()=>{opts.onAction&&opts.onAction();dismiss();};elx.appendChild(b);
  }
  cont.appendChild(elx);
  let t=setTimeout(dismiss,opts.duration||5000);
  function dismiss(){clearTimeout(t);elx.classList.add('out');setTimeout(()=>elx.remove(),200);}
  return dismiss;
}

function posTip(x,y){
  tipEl.style.visibility='hidden';tipEl.style.display='block';
  const tw=tipEl.offsetWidth,th=tipEl.offsetHeight,vw=window.innerWidth,vh=window.innerHeight;
  tipEl.style.visibility='';
  let tx=x+8;if(tx+tw>vw-10)tx=x-tw-8;
  let ty=y;if(ty+th>vh-10)ty=vh-th-10;if(ty<6)ty=6;
  tipEl.style.left=tx+'px';tipEl.style.top=ty+'px';
}

  let totS=0;S.projects.forEach(p=>{totS+=(p.samples||[]).length;});
  const cards=S.projects.map(p=>{
    const tot=totalSt(p),sm=p.samples||[];
    const comp=sm.filter(s=>tot>0&&progress(s,p)===tot).length;
    const avg=sm.length?Math.round(sm.reduce((a,s)=>a+(tot>0?progress(s,p)/tot:0),0)/sm.length*100):0;
    return`<div class="pcard" onclick="openProj('${p.id}')">
      <div class="pcard-hd"><span class="pcard-dot" style="background:${p.color}"></span><span class="pcard-name">${esc(p.name)}</span></div>
      <div class="pcard-body">
        <div class="pcard-stats">
          <span>${ic('tube',17)}<b>${sm.length}</b> muestras</span>
          <span>${ic('branch',17)}<b>${p.steps.length}</b> etapas</span>
          <span>${ic('circle-check',17)}<b>${comp}</b> completas</span>
        </div>
        ${ring(avg,80,8)}
      </div>
    </div>`;
  }).join('');

  c.innerHTML=`<div class="wrap">
    <div class="hero">
      <div><div class="eyebrow">Proyectos</div><h1 class="title">Proyectos</h1><p class="sub">${S.projects.length} proyecto(s) · ${totS} muestras en seguimiento.</p></div>
      <button class="btn btn-p" onclick="openModal('proj')">${ic('plus',17)} Nuevo proyecto</button>
    </div>
    <div class="home-grid">${cards}</div>
  </div>`;
}

function openProj(id){V.area='projects';S.area='projects';V.page='proj';V.pid=id;V.sid=null;const pv=(S.projView&&S.projView[id])||{};V.filter=pv.filter||'all';V.sort=pv.sort||'recent';V.q='';S.lastPid=id;save();closeDrawer();if(isMobile()&&!S.sideOff){S.sideOff=true;applySide();}renderAll();}

    </div>

      <div class="stat"><div class="stat-ic" style="background:var(--dn-bg);color:var(--dn-tx)">${ic('circle-check',25)}</div><div><div class="stat-l">Completadas</div><div class="stat-v" style="color:var(--ac)">${comp}</div></div></div>
      <div class="stat"><div class="stat-ic" style="background:var(--pr-bg);color:var(--pr-tx)">${ic('progress',25)}</div><div><div class="stat-l">En progreso</div><div class="stat-v" style="color:var(--amber)">${inp}</div></div></div>
      <div class="stat"><div class="stat-ic" style="background:var(--pd-bg);color:var(--pd-tx)">${ic('clock',25)}</div><div><div class="stat-l">Pendientes</div><div class="stat-v" style="color:var(--tx3)">${pend}</div></div></div>

      <div class="sec-hd">

        <select class="sel" onchange="V.sort=this.value;applySamples()">

function refreshFlow(){const w=document.getElementById('flowWrap'),p=proj(V.pid);if(w&&p){w.innerHTML=buildFlow(p);initFlowDnD();}}
// Refresca toda la vista de proyecto (estadísticas, anillo de cabecera, flujo y tarjetas) sin cerrar el panel ni saltar el scroll
function refreshProj(){const c=scrollEl();if(!c||V.page!=='proj'||V.area!=='projects')return;const top=c.scrollTop;renderProj(c);c.scrollTop=top;}

function buildFlow(p){
  const steps=p.steps||[];
  if(!steps.length)return`<div class="flow-empty">${ic('branch',46)}<p>Este proyecto no tiene etapas todavía. Añade la primera para construir el flujo.</p><button class="btn btn-p sm" onclick="openModal('step','${p.id}')">${ic('plus',16)} Añadir etapa</button></div>`;
  const sm=p.samples||[];
  let html='<div class="flow-row">';
  steps.forEach((s,i)=>{
    if(i>0)html+=`<div class="flow-arr">${ic('chevron-right',26)}</div>`;
    const valCount=sm.filter(x=>x.validations?.[s.id]).length;
    const pct=sm.length?Math.round(valCount/sm.length*100):0;
    html+=`<div class="flow-col"><div class="fnode" data-nid="${s.id}" data-pid="${p.id}" tabindex="0" onmouseenter="showNodeTip(event,this)" onmouseleave="hideTip()" onfocus="showNodeTip(event,this)" onblur="hideTip()">
      <div class="fnode-top"><i style="width:${pct}%"></i></div>
      <div class="fnode-body">
        <div class="fnode-tagrow">${i===0?'<span class="fnode-tag">INICIO</span>':`<span class="fnode-num">${i+1}</span>`}</div>
        <div class="fnode-lbl">${esc(s.name)}</div>
        <div class="fnode-meta">${ic('circle-check',13)}${valCount}/${sm.length} validadas</div>
      </div>
    </div>`;
    html+=`<div class="fbranch-stem"></div><div class="fbranch-col">`;
    (s.branches||[]).forEach(b=>{
      html+=`<div class="fbnode" data-bid="${b.id}" data-sid="${s.id}" data-pid="${p.id}" tabindex="0" onmouseenter="showBranchTip(event,this)" onmouseleave="hideTip()" onfocus="showBranchTip(event,this)" onblur="hideTip()"><span class="bi">${ic('branch',15)}</span><span class="fbnode-lbl">${esc(b.name)}</span></div>`;
    });
    html+=`<button class="fadd-branch" onclick="openModal('branch','${p.id}','${s.id}')">${ic('fork',15)} Rama paralela</button>`;
    html+=`</div></div>`;
  });
  html+=`</div>`;return html;
}

function showNodeTip(ev,elm){
  const rect=elm.getBoundingClientRect();ev={clientX:rect.right,clientY:rect.top};
  const sid=elm.dataset.nid,pid=elm.dataset.pid,p=proj(pid);
  const idx=(p.steps||[]).findIndex(x=>x.id===sid),s=p.steps[idx];if(!s)return;
  const total=(p.samples||[]).length,validated=(p.samples||[]).filter(sm=>sm.validations?.[sid]).length;
  const pct=total?Math.round(validated/total*100):0,nb=(s.branches||[]).length;
  const brHtml=nb?`<div class="tip-bh">Ramas paralelas (${nb})</div>${s.branches.map(b=>`<div class="tip-bi">${ic('branch',13)}${esc(b.name)}</div>`).join('')}`:'';
  const first=idx===0,last=idx===p.steps.length-1;
  showTip(ev,`
    <div class="tip-hd"><div class="tip-hd-ic">${ic('circle-dot',17)}</div><div class="tip-hd-tx"><div class="tip-title">${esc(s.name)}</div><div class="tip-sub">Etapa ${idx+1} de ${p.steps.length}</div></div></div>
    <div class="tip-body">
      <div class="tip-row"><span class="tip-lbl">Muestras validadas</span><span class="tip-val">${validated} / ${total}</span></div>
      <div class="tip-mini"><i style="width:${pct}%"></i></div>
      ${brHtml}
    </div>
    <div class="tip-move"><span>Reordenar etapa</span>
      <button ${first?'disabled':''} onclick="moveStep('${pid}','${sid}',-1)" title="Mover izquierda">${ic('arrow-left',16)}</button>
      <button ${last?'disabled':''} onclick="moveStep('${pid}','${sid}',1)" title="Mover derecha">${ic('arrow-right',16)}</button>
    </div>
    <div class="tip-menu">
      <button class="tip-mi" onclick="hideTip();openModal('step','${pid}','${sid}')">${ic('edit',17)} Editar etapa</button>
      <button class="tip-mi" onclick="hideTip();openModal('branch','${pid}','${sid}')">${ic('fork',17)} Añadir rama paralela</button>
      <button class="tip-mi dng" onclick="hideTip();delStep('${pid}','${sid}')">${ic('trash',17)} Eliminar etapa</button>
    </div>`);
}
function showBranchTip(ev,elm){
  const rect=elm.getBoundingClientRect();ev={clientX:rect.right,clientY:rect.top};
  const bid=elm.dataset.bid,sid=elm.dataset.sid,pid=elm.dataset.pid,p=proj(pid);
  const st=(p.steps||[]).find(x=>x.id===sid),b=(st?.branches||[]).find(x=>x.id===bid);if(!b)return;
  showTip(ev,`
    <div class="tip-hd"><div class="tip-hd-ic">${ic('branch',17)}</div><div class="tip-hd-tx"><div class="tip-title">${esc(b.name)}</div><div class="tip-sub">Rama de ${esc(st?.name||'')}</div></div></div>
    <div class="tip-menu">
      <button class="tip-mi" onclick="hideTip();openModal('editBranch','${pid}','${sid}','${bid}')">${ic('edit',17)} Editar rama</button>
      <button class="tip-mi dng" onclick="hideTip();delBranch('${pid}','${sid}','${bid}')">${ic('trash',17)} Eliminar rama</button>
    </div>`);
}
function moveStep(pid,sid,dir){
  const p=proj(pid),arr=p.steps,i=arr.findIndex(x=>x.id===sid),j=i+dir;
  if(i<0||j<0||j>=arr.length)return;
  [arr[i],arr[j]]=[arr[j],arr[i]];save();refreshFlow();hideTip();
}

/* ════════ SAMPLES GRID ════════ */
function applySamples(){
  const p=proj(V.pid);if(!p)return;
  const sr=document.getElementById('srch');if(sr)V.q=sr.value;
  const q=(V.q||'').toLowerCase(),tot=totalSt(p);
  let list=(p.samples||[]).filter(s=>s.code.toLowerCase().includes(q)||(s.desc||'').toLowerCase().includes(q));
  list=list.filter(s=>{const pr=progress(s,p);if(V.filter==='done')return tot>0&&pr===tot;if(V.filter==='prog')return pr>0&&(pr<tot||tot===0);if(V.filter==='pend')return pr===0;return true;});
  if(V.sort==='code')list.sort((a,b)=>a.code.localeCompare(b.code,'es',{numeric:true}));
  else if(V.sort==='progress')list.sort((a,b)=>pctOf(b,p)-pctOf(a,p));
  else if(V.sort==='progress-asc')list.sort((a,b)=>pctOf(a,p)-pctOf(b,p));
  else list.sort((a,b)=>(lastActivity(b)||'').localeCompare(lastActivity(a)||''));
  document.querySelectorAll('.seg-btn').forEach(b=>{const map={Todas:'all',Completas:'done','En progreso':'prog',Pendientes:'pend'};b.classList.toggle('on',map[b.textContent.trim()]===V.filter);});
  if(!S.projView)S.projView={};S.projView[V.pid]={filter:V.filter,sort:V.sort};try{localStorage.setItem(SK,JSON.stringify(S));}catch(_){}
  const g=document.getElementById('sgrid');if(g)g.innerHTML=renderSCards(p,list);
}
function renderSCards(p,samples){
  if(!samples.length)return`<div class="empty"><div class="empty-ic">${ic('flask-off',40)}</div><h3>Sin muestras</h3><p>No hay muestras que coincidan con el filtro o la búsqueda.</p></div>`;
  const tot=totalSt(p),aSt=allSteps(p);
  return samples.map(s=>{
    const done=progress(s,p),pct=tot>0?Math.round(done/tot*100):0;
    const badge=pct===100&&tot>0?'<span class="badge b-done">Completa</span>':done>0?'<span class="badge b-prog">En progreso</span>':'<span class="badge b-pend">Pendiente</span>';
    const strip=aSt.map(st=>{const v=s.validations?.[st.id];return`<span class="${v?'d':''}${st._br?' br':''}" title="${esc(st.name)}${v?' ✓':' — pendiente'}"></span>`;}).join('');
    const la=lastActivity(s);
    return`<div class="scard" onclick="openSample('${s.id}')">
      <div class="sc-top">
        <div class="sc-info">
          <div class="sc-hd"><span class="sc-code">${esc(s.code)}</span>${badge}${dueBadge(s,p)}
            <div class="sc-acts">
              <button class="sc-ibtn" title="Editar muestra" onclick="event.stopPropagation();openModal('sample','${p.id}','${s.id}')">${ic('edit',18)}</button>
              <button class="sc-ibtn" title="Duplicar muestra" onclick="event.stopPropagation();dupSample('${p.id}','${s.id}')">${ic('copy',18)}</button>
              <button class="sc-ibtn" title="Eliminar muestra" onclick="event.stopPropagation();delSample('${p.id}','${s.id}')">${ic('trash',18)}</button>
            </div>
          </div>
          <div class="sc-desc">${esc(s.desc||'Sin descripción')}</div>
          <div class="sc-meta">${ic('list-check',15)}<b>${done}</b>/${tot} etapas${la?`<span style="opacity:.4">·</span>${ic('clock',15)}${relTime(la)}`:''}${(()=>{const n=phLinksFor(p.id,s.id).length;return n?`<span style="opacity:.4">·</span>${ic('flask',15)}${n} fenotipo${n>1?'s':''}`:'';})()}</div>
        </div>
        ${ring(pct,68,7)}
      </div>
      <div class="strip">${strip}</div>
    </div>`;
  }).join('');
}

/* ════════ SAMPLE DRAWER ════════ */
function openSample(sid){V.sid=sid;renderDrawer();}
function openSampleFrom(pid,sid){V.area='projects';S.area='projects';V.page='proj';V.pid=pid;V.sid=sid;V.filter='all';V.sort='recent';V.q='';S.lastPid=pid;save();renderAll();setTimeout(()=>renderDrawer(),40);}
function closeDrawer(){const r=document.getElementById('drawerRoot');r.innerHTML='';V.sid=null;}
function renderDrawer(){
  const p=proj(V.pid),s=p&&(p.samples||[]).find(x=>x.id===V.sid);
  const r=document.getElementById('drawerRoot');
  if(!p||!s){r.innerHTML='';return;}
  const tot=totalSt(p),done=progress(s,p),pct=tot>0?Math.round(done/tot*100):0;

  function stepRow(st,br){
    const v=s.validations?.[st.id];
    return`<div class="dtl-step ${v?'done':''}">
      <div class="dtl-circ ${v?'done':'pend'}">${v?ic('check',17):ic('point',17)}</div>
      <div class="dtl-body2">
        <div class="dtl-name">${esc(st.name)}${br?'<span class="dtl-br-tag">rama</span>':''}</div>
        <div class="dtl-sub ${v?'done-c':''}">${v?`${ic('calendar-check',15)}${fmtDate(v)} · ${relTime(v)}`:`${ic('clock',15)}Pendiente`}</div>
        ${v?`<button class="btn btn-unv sm" onclick="toggleVal('${p.id}','${s.id}','${st.id}',false)">${ic('x',15)} Desvalidar</button>`:`<button class="btn btn-val sm" onclick="toggleVal('${p.id}','${s.id}','${st.id}',true)">${ic('check',15)} Validar</button>`}
      </div>
    </div>`;
  }
  let stepsH='';
  (p.steps||[]).forEach(st=>{stepsH+=stepRow(st,false);if(st.branches?.length){stepsH+=`<div class="bwrap">`;st.branches.forEach(b=>stepsH+=stepRow(b,true));stepsH+=`</div>`;}});

  const linkedPh=phLinksFor(p.id,s.id);
  const phSection=`<div class="dl-sec">
    <div class="dl-sec-hd">${ic('flask',16)} Fenotipos vinculados <span class="cnt">${linkedPh.length}</span>
      <button class="btn btn-g sm" style="margin-left:auto" onclick="openLinkPhenoModal('${p.id}','${s.id}')">${ic('link',14)} Vincular</button></div>
    ${linkedPh.length?linkedPh.map(f=>{const cls=phClassifySample(f);const nd=f.markers.filter(m=>cls[m.id]==='diff').length;
      return `<button class="linked-ph" onclick="gotoPheno('${f.id}')">${ic('flask',15)}<span class="lp-name">${esc(f.title||'Sin título')}</span><span class="lp-meta">${f.populations.length} pobl. · ${nd} distinguen</span>${ic('chevron-right',15)}</button>`;}).join('')
      :'<div class="dl-empty">Ninguno. Vincula o crea un fenotipo para esta muestra.</div>'}
  </div>`;

  r.innerHTML=`<div class="drawer-ov show" onclick="closeDrawer()"></div>
  <aside class="drawer show">
    <div class="drawer-hd">
      <span class="phead-dot" style="background:${p.color}"></span>
      <span class="drawer-code">${esc(s.code)}</span>
      ${dueBadge(s,p)}
      <button class="icon-btn" title="Editar muestra" onclick="openModal('sample','${p.id}','${s.id}')">${ic('edit',19)}</button>
      <button class="icon-btn" title="Duplicar muestra" onclick="dupSample('${p.id}','${s.id}')">${ic('copy',19)}</button>
      <button class="icon-btn" title="Eliminar muestra" onclick="delSample('${p.id}','${s.id}')">${ic('trash',19)}</button>
      <button class="icon-btn" title="Cerrar" onclick="closeDrawer()">${ic('x',20)}</button>
    </div>
    <div class="drawer-body">
      ${s.desc?`<div class="drawer-desc">${esc(s.desc)}</div>`:''}
      <div class="dtl-hero">
        ${ring(pct,108,10)}
        <div class="mini">
          <div><span class="mic" style="background:var(--dn-bg);color:var(--dn-tx)">${ic('circle-check',17)}</span><b>${done}</b> validadas</div>
          <div><span class="mic" style="background:var(--pd-bg);color:var(--pd-tx)">${ic('clock',17)}</span><b>${tot-done}</b> pendientes</div>
        </div>
      </div>
      ${tot>0?`<div class="bulk">
        <button class="btn btn-val sm" onclick="validateAll('${p.id}','${s.id}')" ${done===tot?'disabled style="opacity:.5"':''}>${ic('checks',15)} Validar todo</button>
        <button class="btn btn-g sm" onclick="resetSample('${p.id}','${s.id}')" ${done===0?'disabled style="opacity:.5"':''}>${ic('rotate',15)} Reiniciar</button>
      </div>`:''}
      <div>${stepsH||'<div class="empty"><div class="empty-ic">'+ic('branch',40)+'</div><p>Define etapas en el flujo para empezar a validar.</p></div>'}</div>
      ${phSection}
    </div>
  </aside>`;
}

function toggleVal(pid,sid,stepId,validate){
  const p=proj(pid),s=(p.samples||[]).find(x=>x.id===sid);
  if(!s.validations)s.validations={};
  if(validate)s.validations[stepId]=new Date().toISOString();else delete s.validations[stepId];
  save();refreshProj();renderDrawer();
}
function validateAll(pid,sid){
  const p=proj(pid),s=(p.samples||[]).find(x=>x.id===sid);
  if(!s.validations)s.validations={};const now=new Date().toISOString();
  allSteps(p).forEach(st=>{if(!s.validations[st.id])s.validations[st.id]=now;});
  save();refreshProj();renderDrawer();toast('Todas las etapas validadas',{icon:'checks'});
}
function resetSample(pid,sid){
  const p=proj(pid),s=(p.samples||[]).find(x=>x.id===sid);
  const snap=JSON.parse(JSON.stringify(s.validations||{}));s.validations={};save();refreshProj();renderDrawer();
  toast('Validaciones reiniciadas',{icon:'rotate',actionLabel:'Deshacer',onAction:()=>{s.validations=snap;save();refreshProj();renderDrawer();}});
}

/* ════════ MODALS ════════ */
function closeModal(){document.getElementById('mroot').innerHTML='';}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(document.getElementById('mroot').innerHTML){closeModal();}else if(document.getElementById('drawerRoot').innerHTML){closeDrawer();}return;}
  const modalOpen=!!document.getElementById('mroot').innerHTML;
  const typing=/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement?.tagName||'');
  if(e.key==='Enter'&&modalOpen){const ov=document.querySelector('.modal-ov');if(ov){const pr=ov.querySelector('.btn-p');if(pr&&document.activeElement?.tagName!=='SELECT'){e.preventDefault();pr.click();}}return;}
  if(modalOpen||typing)return;
  if(e.key==='/'){const sr=document.getElementById('srch')||document.getElementById('gsrch');if(sr){e.preventDefault();sr.focus();}}
  else if(e.key.toLowerCase()==='n'){if(V.page==='proj')openModal('sample',V.pid);else openModal('proj');}

});

function pickCol(elm,hid){elm.closest('.cpick').querySelectorAll('.cdot').forEach(d=>d.classList.remove('on'));elm.classList.add('on');document.getElementById(hid).value=elm.style.background;}

function newProj(){
  const name=(document.getElementById('pn').value||'').trim(),color=document.getElementById('pc').value;
  if(!name){document.getElementById('pn').focus();return;}
  const uname=uniqueName(name,projNames(),'Proyecto');
  const p={id:uid(),name:uname,color,steps:[],samples:[],createdAt:new Date().toISOString()};
  S.projects.push(p);save();closeModal();openProj(p.id);toast('Proyecto creado',{icon:'folder'});uniqToast(name,uname);
}
function saveProj(pid){const p=proj(pid);const asked=(document.getElementById('pn').value||'').trim()||p.name;const uname=uniqueName(asked,projNames(pid),p.name);p.name=uname;p.color=document.getElementById('pc').value;save();closeModal();renderAll();uniqToast(asked,uname);}
function dupProj(pid){
  const p=proj(pid);if(!p)return;
  const copy=JSON.parse(JSON.stringify(p));copy.id=uid();copy.name=uniqueName(p.name+' (copia)',projNames(),'Proyecto');copy.createdAt=new Date().toISOString();
  const map={};copy.steps.forEach(st=>{const ni=uid();map[st.id]=ni;st.id=ni;(st.branches||[]).forEach(b=>{const nb=uid();map[b.id]=nb;b.id=nb;});});
  copy.samples.forEach(sm=>{sm.id=uid();const nv={};Object.entries(sm.validations||{}).forEach(([k,v])=>{if(map[k])nv[map[k]]=v;});sm.validations=nv;});
  const i=S.projects.findIndex(x=>x.id===pid);S.projects.splice(i+1,0,copy);save();renderAll();toast('Proyecto duplicado',{icon:'copy'});
}
function delProj(pid){
  const i=S.projects.findIndex(x=>x.id===pid);if(i<0)return;const removed=S.projects[i];S.projects.splice(i,1);
  if(V.pid===pid)goHome();else{save();renderAll();}
  toast(`Proyecto "${removed.name}" eliminado`,{icon:'trash',actionLabel:'Deshacer',duration:6000,onAction:()=>{S.projects.splice(Math.min(i,S.projects.length),0,removed);save();renderAll();}});
}
function newStep(pid){const name=(document.getElementById('sn').value||'').trim();if(!name){document.getElementById('sn').focus();return;}const p=proj(pid);if(!p.steps)p.steps=[];p.steps.push({id:uid(),name,branches:[]});save();closeModal();renderMain();}
function saveStep(pid,sid){const name=(document.getElementById('sn').value||'').trim();if(!name)return;const p=proj(pid),s=p.steps.find(x=>x.id===sid);s.name=name;save();closeModal();renderMain();}
function delStep(pid,sid){const p=proj(pid),i=(p.steps||[]).findIndex(x=>x.id===sid);if(i<0)return;const removed=p.steps[i];p.steps.splice(i,1);save();renderMain();toast('Etapa eliminada',{icon:'trash',actionLabel:'Deshacer',onAction:()=>{p.steps.splice(i,0,removed);save();renderMain();}});}
function newBranch(pid){
  const stepId=(document.getElementById('bfrom').value||'').trim(),name=(document.getElementById('bn').value||'').trim();
  if(!stepId){toast('Selecciona una etapa de origen',{icon:'alert'});return;}
  if(!name){document.getElementById('bn').focus();return;}
  const p=proj(pid),st=(p.steps||[]).find(x=>x.id===stepId);if(!st)return;if(!st.branches)st.branches=[];
  st.branches.push({id:uid(),name});save();closeModal();renderMain();
}
function saveBranch(pid,sid,bid){const name=(document.getElementById('bn').value||'').trim();if(!name)return;const p=proj(pid),st=(p.steps||[]).find(x=>x.id===sid),b=(st.branches||[]).find(x=>x.id===bid);b.name=name;save();closeModal();renderMain();}
function delBranch(pid,sid,bid){const p=proj(pid),st=(p.steps||[]).find(x=>x.id===sid),i=(st.branches||[]).findIndex(x=>x.id===bid);if(i<0)return;const removed=st.branches[i];st.branches.splice(i,1);save();renderMain();toast('Rama eliminada',{icon:'trash',actionLabel:'Deshacer',onAction:()=>{st.branches.splice(i,0,removed);save();renderMain();}});}
function newSample(pid){
  const code=(document.getElementById('mc').value||'').trim();if(!code){document.getElementById('mc').focus();return;}
  const p=proj(pid);
  if((p.samples||[]).some(s=>s.code.toLowerCase()===code.toLowerCase())){document.getElementById('mcHint').classList.add('show');return;}
  const desc=(document.getElementById('md').value||'').trim();if(!p.samples)p.samples=[];
  const due=(document.getElementById('mdue')&&document.getElementById('mdue').value)||'';
  p.samples.push({id:uid(),code,desc,due:due||undefined,validations:{},createdAt:new Date().toISOString()});save();closeModal();renderMain();
}
function saveSample(pid,sid){
  const code=(document.getElementById('mc').value||'').trim();if(!code)return;const p=proj(pid),s=(p.samples||[]).find(x=>x.id===sid);
  if((p.samples||[]).some(o=>o.id!==sid&&o.code.toLowerCase()===code.toLowerCase())){document.getElementById('mcHint').classList.add('show');return;}
  s.code=code;s.desc=(document.getElementById('md').value||'').trim();const due=(document.getElementById('mdue')&&document.getElementById('mdue').value)||'';if(due)s.due=due;else delete s.due;save();closeModal();renderMain();if(V.sid===sid)renderDrawer();
}
function dupSample(pid,sid){
  const p=proj(pid),s=(p.samples||[]).find(x=>x.id===sid);if(!s)return;
  let base=s.code+'-copia',code=base,n=2;while((p.samples||[]).some(o=>o.code.toLowerCase()===code.toLowerCase())){code=base+n;n++;}
  const copy={id:uid(),code,desc:s.desc,validations:{},createdAt:new Date().toISOString()};
  const i=p.samples.findIndex(x=>x.id===sid);p.samples.splice(i+1,0,copy);save();renderMain();toast('Muestra duplicada (sin validaciones)',{icon:'copy'});
}
function delSample(pid,sid){
  const p=proj(pid),i=(p.samples||[]).findIndex(x=>x.id===sid);if(i<0)return;const removed=p.samples[i];p.samples.splice(i,1);
  if(V.sid===sid)closeDrawer();save();renderMain();
  toast(`Muestra "${removed.code}" eliminada`,{icon:'trash',actionLabel:'Deshacer',duration:6000,onAction:()=>{p.samples.splice(i,0,removed);save();renderMain();}});
}

function download(name,content,mime){const blob=new Blob([content],{type:mime||'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function combinedPayload(){return{app:'bioflow',kind:'combined',version:2,savedAt:new Date().toISOString(),projects:S.projects,phenotype:{samples:S.ph.samples,options:S.ph.options,presets:S.ph.presets,export:S.ph.export},reports:S.reports,reportPresets:S.reportPresets,feedback:S.feedback};}

  const stamp=new Date().toISOString().slice(0,10);
  saveExportText(`bioflow-${stamp}.json`,JSON.stringify(combinedPayload(),null,2),'application/json');
}
function importData(ev){
  const file=ev.target.files&&ev.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      applyCombined(data);
      save();renderAll();updateFileBtn();updateFbBtn();toast('Datos importados',{icon:'upload'});
    }catch(_){toast('No se pudo leer el archivo JSON',{icon:'alert'});}
    ev.target.value='';
  };
  reader.readAsText(file);
}
function exportProjectCSV(pid){
  const p=proj(pid);if(!p)return;const steps=allSteps(p),tot=steps.length;
  const head=['Codigo','Descripcion','Progreso_%','Validadas','Total',...steps.map(s=>s.name)];const rows=[head];
  (p.samples||[]).forEach(s=>{const done=progress(s,p),pct=tot>0?Math.round(done/tot*100):0;rows.push([s.code,s.desc||'',pct,done,tot,...steps.map(st=>s.validations?.[st.id]?fmtDate(s.validations[st.id]):'')]);});
  const csv='﻿'+rows.map(r=>r.map(c=>{c=String(c==null?'':c);return /[",;\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(';')).join('\n');
  saveExportText(`${p.name.replace(/[^\w-]+/g,'_')}.csv`,csv,'text/csv;charset=utf-8');
}

/* ════════ FILE SYNC (Electron nativo  ·  o File System Access API en navegador) ════════ */
const DESKTOP = !!(window.desktop && window.desktop.read);   // expuesto por preload.js en la app de escritorio
const fileSupported = DESKTOP || ('showSaveFilePicker' in window);
let fileHandle=null,fileLinked=false,filePending=false,fileWriteTimer=null,fileBusy=false,fileName='';
const IDB_DB='bioflow_fs',IDB_STORE='handles',IDB_KEY='dataFile';

function idb(){return new Promise((res,rej)=>{const r=indexedDB.open(IDB_DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(IDB_STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbSet(k,v){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
async function idbGet(k){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction(IDB_STORE,'readonly');const rq=tx.objectStore(IDB_STORE).get(k);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});}
async function idbDel(k){const db=await idb();return new Promise((res)=>{const tx=db.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).delete(k);tx.oncomplete=()=>res();});}
async function verifyPerm(handle,write){const opts={mode:write?'readwrite':'read'};try{if((await handle.queryPermission(opts))==='granted')return true;if((await handle.requestPermission(opts))==='granted')return true;}catch(_){}return false;}

function migrateProjects(){
  (S.projects||[]).forEach(p=>{
    if(!Array.isArray(p.steps))p.steps=[];
    if(!Array.isArray(p.samples))p.samples=[];
    p.steps.forEach(s=>{if(!Array.isArray(s.branches))s.branches=[];});
    p.samples.forEach(sm=>{if(!sm.validations||typeof sm.validations!=='object')sm.validations={};});
  });
}

async function readFile(){
  if(DESKTOP){const r=await window.desktop.read();if(r&&r.ok&&r.text&&r.text.trim()){applyCombined(JSON.parse(r.text));return true;}return false;}
  const f=await fileHandle.getFile();const txt=await f.text();
  if(!txt.trim())return false;
  applyCombined(JSON.parse(txt));
  return true;
}
async function writeFile(){
  if(!fileLinked||fileBusy)return;
  fileBusy=true;
  try{
    if(DESKTOP){const r=await window.desktop.write(JSON.stringify(combinedPayload(),null,2));if(!r||!r.ok)throw new Error('write');}
    else{if(!fileHandle){fileBusy=false;return;}const w=await fileHandle.createWritable();await w.write(JSON.stringify(combinedPayload(),null,2));await w.close();}
    saveIndSaved();
  }catch(e){fileLinked=false;updateFileBtn();saveIndErr();toast('No se pudo escribir en el archivo vinculado',{icon:'alert'});}
  fileBusy=false;
}
function scheduleFileWrite(){if(!fileLinked)return;clearTimeout(fileWriteTimer);fileWriteTimer=setTimeout(writeFile,500);}

// Autovinculación al arrancar: si hay un archivo configurado se vincula y carga solo.
async function restoreFileLink(){
  if(DESKTOP){
    try{
      const cfg=await window.desktop.getConfig();
      if(cfg&&cfg.dataFile){
        const r=await window.desktop.read();
        if(r&&r.ok){fileLinked=true;fileName=cfg.dataFile;if(r.text&&r.text.trim()){try{applyCombined(JSON.parse(r.text));}catch(_){}}else{await writeFile();}}
        // configurado pero ilegible (movido/borrado): se queda sin vincular y se pedirá al arrancar
      }
    }catch(_){}
    return;
  }
  if(!('showSaveFilePicker' in window))return;
  let handle;try{handle=await idbGet(IDB_KEY);}catch(_){}
  if(!handle)return;
  fileHandle=handle;
  let perm='prompt';try{perm=await handle.queryPermission({mode:'readwrite'});}catch(_){}
  if(perm==='granted'){fileLinked=true;try{await readFile();}catch(_){}}
  else{filePending=true;}
}
// Si tras restaurar no hay vínculo, abre el selector (ventana emergente) para elegir el archivo de guardado.
async function autoLinkOnStart(){
  if(fileLinked||!DESKTOP)return;

  if(!fileLinked)fileDialog();
}

}

   MÓDULO PHENOTYPE + DASHBOARD + VÍNCULOS + SHELL
   ════════════════════════════════════════════════════════════ */
function clone(x){return JSON.parse(JSON.stringify(x));}
function fmtDay(iso){if(!iso)return'';try{return new Date(iso).toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'});}catch(_){return'';}}
function textColor(hex){if(!hex||hex[0]!=='#'||hex.length<7)return '#fff';const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return (0.299*r+0.587*g+0.114*b)/255>0.6?'#15201d':'#fff';}

const DEFAULT_OPTIONS=[
  {id:'neg',label:'−',color:'#94A3B8',cat:'neg'},
  {id:'dim',label:'dim',color:'#2E7D6B',cat:'pos'},
  {id:'pos',label:'+',color:'#22C55E',cat:'pos'},
  {id:'bri',label:'++',color:'#A3E635',cat:'pos'},
  {id:'var',label:'+/−',color:'#EAB308',cat:'het'},
  {id:'na',label:'n/a',color:'#64748B',cat:''},
  {id:'noapl',label:'NA',color:'#9AA5B1',na:true,cat:''}
];
const DEFAULT_PRESETS=[
  {id:'p_t',name:'Linfocitos T (ejemplo)',markers:['CD3','CD4','CD8','CD45RA','CD45RO','CD26','CCR7']},
  {id:'p_b',name:'Linfocitos B (ejemplo)',markers:['CD19','CD20','CD27','IgD','CD38']}
];
const NEW_SAMPLE_MARKERS=['CD3','CD4','CD8','CD45RO','CD26'];

function phMigrate(){
  if(!S.ph||typeof S.ph!=='object')S.ph={};
  if(!Array.isArray(S.ph.samples))S.ph.samples=[];
  if(!Array.isArray(S.ph.options)||!S.ph.options.length)S.ph.options=clone(DEFAULT_OPTIONS);
  if(!S.ph.naAdded){if(!S.ph.options.some(o=>o&&o.na)){S.ph.options.push({id:'noapl',label:'NA',color:'#9AA5B1',na:true});}S.ph.naAdded=true;}
  S.ph.options.forEach(o=>{if(typeof o.cat!=='string'){
    if(o.na)o.cat='';
    else{const l=(o.label||'');if(l.toLowerCase().indexOf('het')>=0)o.cat='het';else{const hasP=l.indexOf('+')>=0,hasM=l.indexOf('-')>=0||l.indexOf('−')>=0;o.cat=(hasP&&!hasM)?'pos':(hasM&&!hasP)?'neg':'';}}
  }});
  if(!Array.isArray(S.ph.presets))S.ph.presets=clone(DEFAULT_PRESETS);
  if(!S.ph.export||typeof S.ph.export!=='object')S.ph.export={};
  const ex=S.ph.export;
  if(typeof ex.convertD!=='boolean')ex.convertD=true;
  if(typeof ex.dWord!=='string')ex.dWord='débil';
  if(typeof ex.convertHet!=='boolean')ex.convertHet=true;
  if(typeof ex.hetWord!=='string')ex.hetWord='heterog';
  if(ex.order!=='alpha'&&ex.order!=='panel')ex.order='alpha';
  S.ph.samples.forEach(s=>{
    if(!Array.isArray(s.markers))s.markers=[];
    if(!Array.isArray(s.populations))s.populations=[];
    if(s.link!==null&&typeof s.link!=='object')s.link=null;
    if(!s.link)s.link=null; else if(!s.link.pid||!s.link.sid)s.link=null;
    if(s.popSort!=='alpha'&&s.popSort!=='created'&&s.popSort!=='custom')s.popSort='custom';
    if(s.markSort!=='alpha'&&s.markSort!=='created'&&s.markSort!=='custom')s.markSort='custom';
    s.markers.forEach((m,i)=>{if(typeof m.seq!=='number')m.seq=i+1;});
    s.populations.forEach((p,i)=>{if(typeof p.seq!=='number')p.seq=i+1;});
    s.populations.forEach(p=>{
      if(!p.values||typeof p.values!=='object')p.values={};
      if(typeof p.ident!=='string')p.ident='';
      if(typeof p.comment!=='string')p.comment='';
      // Migrar valores escritos en el título tipo "Nombre (31c/uL; 1.06%)" a campos propios
      if(p.count==null&&p.freq==null&&typeof p.title==='string'){
        const m=p.title.match(/^(.*?)\s*\(\s*([\d.,]+)\s*c\/uL\s*;\s*([\d.,]+)\s*%\s*\)\s*$/i);
        if(m){p.title=m[1].trim();p.count=m[2];p.freq=m[3];}
      }
      if(typeof p.count!=='string')p.count=p.count==null?'':String(p.count);
      if(typeof p.freq!=='string')p.freq=p.freq==null?'':String(p.freq);
    });
  });
}
function phSample(id){return S.ph.samples.find(x=>x.id===id);}
// La distinción de poblaciones se basa en la POLARIDAD (positivo vs negativo) configurada
// en «Cuenta como» de las opciones de expresión. Un marcador DISTINGUE si hay al menos una
// población positiva y otra negativa. La expresión heterogénea (het) y las vacías/NA no
// aportan a la distinción (se ignoran). Es «común» si todas las clasificables comparten polaridad.
function phClassifyValues(vals){
  let pos=0,neg=0;
  vals.forEach(v=>{if(v==null||v==='')return;const c=phCatOf(v);if(c==='pos')pos++;else if(c==='neg')neg++;});
  if(pos>0&&neg>0)return 'diff';
  if(pos+neg>=2)return 'common';
  return 'none';
}
function phClassifySample(s){const out={};s.markers.forEach(m=>{out[m.id]=phClassifyValues(s.populations.map(p=>p.values[m.id]));});return out;}
function phClsLabel(c){return c==='diff'?'distingue':c==='common'?'común':'';}
function phLabelOf(id){const o=S.ph.options.find(x=>x.id===id);return o?o.label:'';}

/* ════════ IMPORTAR DATOS COMBINADOS (combinado v2 + formatos antiguos) ════════ */
function applyCombined(data){
  if(Array.isArray(data)){S.projects=data;migrateProjects();phMigrate();return;}
  if(!data||typeof data!=='object')return;
  if(Array.isArray(data.projects))S.projects=data.projects;
  if(data.phenotype&&typeof data.phenotype==='object'){
    if(Array.isArray(data.phenotype.samples))S.ph.samples=data.phenotype.samples;
    if(Array.isArray(data.phenotype.options))S.ph.options=data.phenotype.options;
    if(Array.isArray(data.phenotype.presets))S.ph.presets=data.phenotype.presets;
    if(data.phenotype.export&&typeof data.phenotype.export==='object')S.ph.export=data.phenotype.export;
  } else if(data.app==='fenotipos'){
    if(Array.isArray(data.samples))S.ph.samples=data.samples;
    if(Array.isArray(data.options))S.ph.options=data.options;
    if(Array.isArray(data.presets))S.ph.presets=data.presets;
  }
  if(Array.isArray(data.feedback))S.feedback=data.feedback;
  if(Array.isArray(data.reports))S.reports=data.reports;
  if(data.reportPresets&&typeof data.reportPresets==='object')S.reportPresets=data.reportPresets;
  migrateProjects();phMigrate();reportMigrate();
}

function phCreateSample(){const s={id:uid(),title:uniqueName('Nuevo fenotipo',phNames(),'Fenotipo'),desc:'',createdAt:new Date().toISOString(),link:null,markers:NEW_SAMPLE_MARKERS.map(n=>({id:uid(),name:n})),populations:[]};S.ph.samples.unshift(s);save();phOpenSample(s.id);}
function phDeleteSample(id){const s=phSample(id);if(!s)return;if(!confirm('¿Eliminar el fenotipo "'+s.title+'"? No se puede deshacer.'))return;S.ph.samples=S.ph.samples.filter(x=>x.id!==id);if(V.fsid===id){V.fsid=null;V.fpage='home';}save();renderAll();toast('Fenotipo eliminado',{icon:'trash'});}
function phSetTitle(id,v,el){const s=phSample(id);if(!s)return;const asked=nmu(v).trim()||s.title||'Sin título';const uname=uniqueName(asked,phNames(id),'Fenotipo');s.title=uname;save();renderSidebar();if(el&&el.value!==uname)el.value=uname;uniqToast(asked,uname);}
function phSetDesc(id,v){const s=phSample(id);if(s){s.desc=v;save();}}
function phAddMarker(id){const s=phSample(id);if(!s)return;s.markers.push({id:uid(),name:'Nuevo',seq:phMaxSeq(s.markers)+1});save();phRefreshMatrix(s);}
function phRenameMarker(id,mid,v){const s=phSample(id);if(!s)return;const m=s.markers.find(x=>x.id===mid);if(m){m.name=v;save();}}
function phRemoveMarker(id,mid){const s=phSample(id);if(!s)return;s.markers=s.markers.filter(x=>x.id!==mid);s.populations.forEach(p=>{delete p.values[mid];});save();phRefreshMatrix(s);}
function phMoveMarker(id,mid,dir){const s=phSample(id);if(!s)return;const i=s.markers.findIndex(m=>m.id===mid),j=i+dir;if(i<0||j<0||j>=s.markers.length)return;const t=s.markers[i];s.markers[i]=s.markers[j];s.markers[j]=t;save();phRefreshMatrix(s);}
function phMovePop(id,pid,dir){const s=phSample(id);if(!s)return;const i=s.populations.findIndex(p=>p.id===pid),j=i+dir;if(i<0||j<0||j>=s.populations.length)return;const t=s.populations[i];s.populations[i]=s.populations[j];s.populations[j]=t;save();phRefreshMatrix(s);}
function phMaxSeq(arr){let m=0;arr.forEach(x=>{if((x.seq||0)>m)m=x.seq;});return m;}
function phOrderedMarkers(s){const mode=s.markSort||'custom';const a=s.markers.slice();if(mode==='alpha')a.sort((x,y)=>(x.name||'').localeCompare(y.name||'','es',{numeric:true,sensitivity:'base'}));else if(mode==='created')a.sort((x,y)=>(x.seq||0)-(y.seq||0));return a;}
function phOrderedPops(s){const mode=s.popSort||'custom';const a=s.populations.slice();if(mode==='alpha')a.sort((x,y)=>(x.title||'').localeCompare(y.title||'','es',{numeric:true,sensitivity:'base'}));else if(mode==='created')a.sort((x,y)=>(x.seq||0)-(y.seq||0));return a;}
function phSetPopSort(id,v){const s=phSample(id);if(s){s.popSort=v;save();phRefreshMatrix(s);}}
function phSetMarkSort(id,v){const s=phSample(id);if(s){s.markSort=v;save();phRefreshMatrix(s);}}

let reoDrag=null;
function phSetSortCustom(sid,kind){const s=phSample(sid);if(!s)return;if(kind==='pop')s.popSort='custom';else s.markSort='custom';save();phRefreshMatrix(s);phOpenReorder(sid);}
function phOpenReorder(sid){

    +`<div class="reo-list${custom?'':' locked'}" data-kind="${kind}">${items.map(it=>`<div class="reo-item" draggable="${custom?'true':'false'}" data-id="${it.id}">${ic('menu',15)}<span>${esc(it.title||it.name||'—')}</span></div>`).join('')}</div>`
    +`${custom?'':'<div class="reo-note">Cambia el orden a «Personalizado» para poder arrastrar.</div>'}</div>`;
  openModalHTML(`<div class="modal" style="width:min(760px,96vw)"><div class="mtit"><span class="mtit-ic">${ic('arrow-up-down',19)}</span>Reordenar</div><p class="sub" style="margin-top:2px">Arrastra los elementos para reorganizarlos. El orden solo se aplica en modo «Personalizado».</p><div class="reo-wrap">${col('pop','Poblaciones',phOrderedPops(s),popCustom)}${col('mk','Marcadores',phOrderedMarkers(s),mkCustom)}</div><div class="mact"><button class="btn btn-p sm" onclick="closeModal()">Hecho</button></div></div>`);
  setTimeout(()=>phWireReorder(sid),30);

function phReoAfter(list,y){const els=[...list.querySelectorAll('.reo-item:not(.drag)')];let res=null,min=-Infinity;els.forEach(el=>{const b=el.getBoundingClientRect();const off=y-b.top-b.height/2;if(off<0&&off>min){min=off;res=el;}});return res;}
function phCommitReorder(sid,list){const s=phSample(sid);if(!s)return;const ids=[...list.querySelectorAll('.reo-item')].map(el=>el.dataset.id);const idx=id=>{const i=ids.indexOf(id);return i<0?9999:i;};if(list.dataset.kind==='pop')s.populations.sort((a,b)=>idx(a.id)-idx(b.id));else s.markers.sort((a,b)=>idx(a.id)-idx(b.id));save();phRefreshMatrix(s);}
function phWireReorder(sid){
  document.querySelectorAll('.reo-list:not(.locked)').forEach(list=>{
    list.querySelectorAll('.reo-item').forEach(it=>{
      it.addEventListener('dragstart',e=>{reoDrag=it;setTimeout(()=>it.classList.add('drag'),0);e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain','x');}catch(_){}});
      it.addEventListener('dragend',()=>{if(reoDrag)reoDrag.classList.remove('drag');reoDrag=null;phCommitReorder(sid,list);});
    });
    list.addEventListener('dragover',e=>{if(!reoDrag||reoDrag.parentNode!==list)return;e.preventDefault();const after=phReoAfter(list,e.clientY);if(after==null)list.appendChild(reoDrag);else list.insertBefore(reoDrag,after);});
  });
}
function phAddPop(id){const s=phSample(id);if(!s)return;const np={id:uid(),title:'Población '+(s.populations.length+1),ident:'',comment:'',count:'',freq:'',seq:phMaxSeq(s.populations)+1,values:{}};s.populations.push(np);save();phRefreshMatrix(s);setTimeout(()=>{const el=document.querySelector('.mtx-wrap [data-pid="'+np.id+'"]');if(el){el.scrollIntoView({block:'center',behavior:'smooth'});const inp=el.querySelector('.pop-in');if(inp)inp.focus();}},40);}
function phRenamePop(id,pid,v){const s=phSample(id);if(!s)return;const p=s.populations.find(x=>x.id===pid);if(p){p.title=v;save();}}
function phSetPopFreq(id,pid,v){const s=phSample(id);if(!s)return;const p=s.populations.find(x=>x.id===pid);if(p){p.freq=(v||'').trim();save();}}
function phSetPopIdent(id,pid,v){const s=phSample(id);if(!s)return;const p=s.populations.find(x=>x.id===pid);if(p){p.ident=v;save();}}
function phSetPopComment(id,pid,v){const s=phSample(id);if(!s)return;const p=s.populations.find(x=>x.id===pid);if(p){p.comment=v;save();}}
function phSetPopCount(id,pid,v){const s=phSample(id);if(!s)return;const p=s.populations.find(x=>x.id===pid);if(p){p.count=(v||'').trim();save();}}
function phRemovePop(id,pid){
  const s=phSample(id);if(!s)return;
  const i=s.populations.findIndex(x=>x.id===pid);if(i<0)return;
  const removed=s.populations[i];
  s.populations.splice(i,1);save();phRefreshMatrix(s);
  toast('Población "'+((removed&&removed.title)||'sin título')+'" eliminada',{icon:'trash',duration:6000,actionLabel:'Deshacer',onAction:()=>{s.populations.splice(Math.min(i,s.populations.length),0,removed);save();phRefreshMatrix(s);}});
}
function phSetValue(id,pid,mid,v){const s=phSample(id);if(!s)return;const p=s.populations.find(x=>x.id===pid);if(!p)return;if(v==='')delete p.values[mid];else p.values[mid]=v;save();phRefreshMatrix(s);}
function phApplyPreset(id,markerNames){const s=phSample(id);if(!s)return;const byName={};s.markers.forEach(m=>{byName[m.name]=m.id;});const newMarkers=markerNames.map(n=>({id:byName[n]||uid(),name:n}));const keep=new Set(newMarkers.map(m=>m.id));s.populations.forEach(p=>{Object.keys(p.values).forEach(k=>{if(!keep.has(k))delete p.values[k];});});s.markers=newMarkers;save();renderMain();toast('Preset aplicado',{icon:'circle-check'});}
function phSaveAsPreset(id){const s=phSample(id);if(!s)return;openModalHTML(`<div class="modal"><div class="mtit"><span class="mtit-ic">${ic('tag',19)}</span>Guardar panel como preset</div><p class="sub" style="margin-top:4px">Se guardará en Ajustes y podrás aplicarlo a cualquier fenotipo.</p><input class="minput" id="presetName" placeholder="Nombre del preset" value="${esc(s.title)} (panel)"><div class="mact"><button class="btn btn-g sm" onclick="closeModal()">Cancelar</button><button class="btn btn-p sm" onclick="phConfirmSavePreset('${s.id}')">Guardar</button></div></div>`);setTimeout(()=>{const i=document.getElementById('presetName');if(i){i.focus();i.select();}},40);}
function phConfirmSavePreset(id){const s=phSample(id);const name=(document.getElementById('presetName').value||'').trim();if(!name){toast('Escribe un nombre',{icon:'alert'});return;}S.ph.presets.push({id:uid(),name,markers:s.markers.map(m=>m.name)});save();closeModal();toast('Preset "'+name+'" guardado',{icon:'circle-check'});}
function phOpenApplyPreset(id){if(!S.ph.presets.length){toast('No hay presets. Créalos en Ajustes.',{icon:'info'});return;}let items=S.ph.presets.map(p=>`<button class="pick-item" onclick="phApplyPreset('${id}',${JSON.stringify(p.markers).replace(/"/g,'&quot;')});closeModal()"><div style="display:flex;flex-direction:column;gap:2px;width:100%"><span style="font-weight:700">${esc(p.name)}</span><span style="font-size:11.5px;color:var(--tx3);font-family:ui-monospace,monospace">${esc(p.markers.join(' · '))}</span></div></button>`).join('');openModalHTML(`<div class="modal"><div class="mtit"><span class="mtit-ic">${ic('layers',19)}</span>Aplicar preset</div><p class="sub" style="margin-top:4px">Reemplaza los marcadores del panel. Se conservan los valores de los que coincidan por nombre.</p><div style="display:flex;flex-direction:column;gap:8px;margin-top:14px">${items}</div><div class="mact"><button class="btn btn-g sm" onclick="closeModal()">Cerrar</button></div></div>`);}
function phAddOption(){S.ph.options.push({id:uid(),label:'nuevo',color:'#64748B'});save();renderMain();}
function phUpdateOption(id,patch){const o=S.ph.options.find(x=>x.id===id);if(o){Object.assign(o,patch);save();renderMain();}}
function phRemoveOption(id){S.ph.options=S.ph.options.filter(x=>x.id!==id);save();renderMain();}
function phResetOptions(){if(confirm('¿Restaurar las opciones de expresión por defecto?')){S.ph.options=clone(DEFAULT_OPTIONS);save();renderMain();}}
function phMergeOptions(a,b){if(!a||!b||a===b)return;S.ph.samples.forEach(s=>s.populations.forEach(p=>{const v=p.values||{};Object.keys(v).forEach(mid=>{if(v[mid]===a)v[mid]=b;});}));S.ph.options=S.ph.options.filter(o=>o.id!==a);save();renderMain();toast('Opciones fusionadas',{icon:'circle-check'});}
function phMergeOptionsUI(){const a=(document.getElementById('mergeA')||{}).value,b=(document.getElementById('mergeB')||{}).value;if(!a||!b||a===b){toast('Elige dos opciones distintas',{icon:'alert'});return;}const oa=S.ph.options.find(o=>o.id===a),ob=S.ph.options.find(o=>o.id===b);if(!confirm('¿Fusionar «'+(oa?oa.label:'')+'» en «'+(ob?ob.label:'')+'»? Todas las celdas con «'+(oa?oa.label:'')+'» pasarán a «'+(ob?ob.label:'')+'» y se eliminará la primera opción.'))return;phMergeOptions(a,b);}
function phAddPreset(){S.ph.presets.push({id:uid(),name:'Nuevo preset',markers:[]});save();renderMain();}
function phUpdatePreset(id,patch){const p=S.ph.presets.find(x=>x.id===id);if(p){Object.assign(p,patch);save();}}
function phRemovePreset(id){S.ph.presets=S.ph.presets.filter(x=>x.id!==id);save();renderMain();}

function phViewHome(){
  let body;
  if(!S.ph.samples.length){
    body=`<div class="empty"><div class="empty-ic">${ic('layers',38)}</div><h3>Aún no hay fenotipos</h3><p>Crea un fenotipo para empezar a anotar poblaciones y marcadores.</p><button class="btn btn-p" onclick="phCreateSample()">${ic('plus',16)} Nuevo fenotipo</button></div>`;
  }else{
    body=`<div class="scards">${S.ph.samples.map(s=>{
      const nMk=s.markers.length,nPop=s.populations.length;
      const cls=phClassifySample(s);const nDiff=s.markers.filter(m=>cls[m.id]==='diff').length;
      const r=resolveLink(s.link);
      const linkChip=s.link?(r.missing?`<span class="chip chip-dg">${ic('alert',13)} vínculo roto</span>`:`<span class="chip chip-ac">${ic('tube',13)} ${esc(r.sample.code)}</span>`):'';
      return `<div class="scard ph-card" onclick="phOpenSample('${s.id}')">
        <div class="phc-top"><span class="phc-avatar">${ic('flask',19)}</span><h3>${esc(s.title||'Sin título')}</h3><button class="ic-x" title="Eliminar" onclick="event.stopPropagation();phDeleteSample('${s.id}')">${ic('trash',16)}</button></div>
        <div class="desc">${esc(s.desc||'Sin descripción')}</div>
        <div class="meta">
          <span class="chip">${ic('tag',13)} ${nMk} marcadores</span>
          <span class="chip">${ic('layers',13)} ${nPop} poblaciones</span>
          ${nDiff?`<span class="chip chip-diff">${ic('arrow-up-down',13)} ${nDiff} distinguen</span>`:''}
          ${linkChip}
        </div>
        <div class="phc-foot">${ic('clock',12)} ${fmtDay(s.createdAt)}</div>
      </div>`;}).join('')}</div>`;
  }
  const nS=S.ph.samples.length;let totPop=0,totDiff=0;S.ph.samples.forEach(s=>{totPop+=s.populations.length;const cl=phClassifySample(s);totDiff+=s.markers.filter(m=>cl[m.id]==='diff').length;});
  const subtitle=nS?`<p class="sub">${nS} fenotipo(s) · ${totPop} poblaciones · ${totDiff} marcadores que distinguen</p>`:'';
  return `<div class="page-head"><div><div class="eyebrow">Fenotipos</div><h1 class="title">Fenotipos</h1>${subtitle}</div><button class="btn btn-p" onclick="phCreateSample()">${ic('plus',16)} Nuevo fenotipo</button></div>${body}`;
}
function phAutobar(s){
  if(s.populations.length<2)return '<div id="phAutobar"></div>';
  const cls=phClassifySample(s);
  const nDiff=s.markers.filter(m=>cls[m.id]==='diff').length;
  const nCommon=s.markers.filter(m=>cls[m.id]==='common').length;
  return `<div class="auto-bar" id="phAutobar"><span class="auto-lbl">TABLA DE FENOTIPOS</span><span class="auto-pill diff">${ic('arrow-up-down',12)} ${nDiff} distinguen</span><span class="auto-pill common">${ic('equal',12)} ${nCommon} comunes</span></div>`;
}
function phMatrixHead(s){
  const cls=phClassifySample(s);const custom=(s.markSort||'custom')==='custom';
  return `<tr><th class="corner">Población \\ Marcador</th>
    ${phOrderedMarkers(s).map(m=>{const c=cls[m.id];
      const ind=c==='diff'?`<span class="mk-ind">${ic('arrow-up-down',11)}</span>`:c==='common'?`<span class="mk-ind">${ic('equal',11)}</span>`:'';
      const mv='';
      return `<th class="mk-th"><div class="mk-chip ${c}"><div class="mk-chip-row">${ind}<input class="mk-in" value="${esc(m.name)}" onchange="phRenameMarker('${s.id}','${m.id}',this.value)"><button class="mk-del" title="Quitar" onclick="phRemoveMarker('${s.id}','${m.id}')">${ic('x',11)}</button></div>${mv}</div></th>`;}).join('')}
    <th class="mk-th"><button class="add-col" title="Añadir marcador" onclick="phAddMarker('${s.id}')">${ic('plus',15)}</button></th></tr>`;
}
function phMatrixRows(s){
  const cls=phClassifySample(s);const custom=(s.popSort||'custom')==='custom';const oms=phOrderedMarkers(s);
  if(!s.populations.length)return `<tr><td class="empty-row" colspan="${s.markers.length+2}">No hay poblaciones todavía.</td></tr>`;
  return phOrderedPops(s).map(p=>{
    const mv='';
    const cells=oms.map(m=>`<td class="cell ${cls[m.id]==='diff'?'diff':''}">${phCellSelect(s.id,p.id,m.id,p.values[m.id])}</td>`).join('');
    return `<tr data-pid="${p.id}"><th class="pop-th"><div class="pop-cell"><div class="pop-in-wrap"><input class="pop-in" value="${esc(p.title)}" onchange="phRenamePop('${s.id}','${p.id}',this.value)">${mv}<button class="pop-del" title="Quitar población" onclick="phRemovePop('${s.id}','${p.id}')">${ic('trash',13)}</button></div><div class="pop-meta"><input class="pop-id" value="${esc(p.ident||'')}" placeholder="ID" title="Identificador de la población" onchange="phSetPopIdent('${s.id}','${p.id}',this.value)"><input class="pop-num" type="text" inputmode="decimal" value="${esc(p.freq||'')}" placeholder="—" title="Frecuencia (%)" onchange="phSetPopFreq('${s.id}','${p.id}',this.value)"><span class="pop-unit">%</span><input class="pop-num" type="text" inputmode="decimal" value="${esc(p.count||'')}" placeholder="—" title="Valor absoluto (cél/µL)" onchange="phSetPopCount('${s.id}','${p.id}',this.value)"><span class="pop-unit">cél/µL</span></div><textarea class="pop-comment" rows="1" placeholder="Comentario…" title="Comentario" onchange="phSetPopComment('${s.id}','${p.id}',this.value)">${esc(p.comment||'')}</textarea></div></th>${cells}<td></td></tr>`;
  }).join('');
}
// Categoría de un valor según la opción de expresión ('pos'|'neg'|'het'|'')
function phCatOf(id){if(!id)return '';const o=S.ph.options.find(x=>x.id===id);return (o&&o.cat)?o.cat:'';}
function phIsNA(id){const o=S.ph.options.find(x=>x.id===id);return !!(o&&o.na);}
// % de +, − y het de un marcador sobre las poblaciones clasificadas (base = pos+neg+het; NA y no clasificadas se excluyen)
function phMarkerPct(s,m){let pos=0,neg=0,het=0;s.populations.forEach(p=>{const c=phCatOf(p.values[m.id]);if(c==='pos')pos++;else if(c==='neg')neg++;else if(c==='het')het++;});const base=pos+neg+het;return {pos,neg,het,base,pp:base?Math.round(pos/base*100):0,np:base?Math.round(neg/base*100):0,hp:base?Math.round(het/base*100):0};}
// Fila inferior de la matriz
function phMatrixFoot(s){
  const stats=phOrderedMarkers(s).map(m=>phMarkerPct(s,m));
  const row=(cls,label,nKey,pKey)=>'<tr class="mtx-stat"><th class="corner '+cls+'"><span class="stat-lbl">'+label+'</span><span class="stat-sub">n · %</span></th>'+stats.map(st=>{
      if(!st.base)return '<td class="mk-stat '+cls+'"><span class="stat-empty">·</span></td>';
      return '<td class="mk-stat '+cls+'"><span class="stat-cell"><b class="stat-n">'+st[nKey]+'</b><span class="stat-p">'+st[pKey]+'%</span></span></td>';
    }).join('')+'<td></td></tr>';
  return row('st-pos','Positivo','pos','pp')+row('st-neg','Negativo','neg','np')+row('st-het','Heterogéneo','het','hp');
}
// Actualiza solo la tabla y la barra de detección sin re-renderizar toda la vista (conserva el scroll y evita el "salto")
function phRefreshMatrix(s){
  const scroll=document.getElementById('scroll');
  const wrap=document.querySelector('.mtx-wrap');
  const table=wrap?wrap.querySelector('table.mtx'):null;
  if(!table){renderMain();return;}
  const top=scroll?scroll.scrollTop:0;
  const left=wrap.scrollLeft;
  table.innerHTML=`<thead>${phMatrixHead(s)}</thead><tbody>${phMatrixRows(s)}</tbody><tfoot>${phMatrixFoot(s)}</tfoot>`;
  wrap.scrollLeft=left;
  const ab=document.getElementById('phAutobar');
  if(ab){const tmp=document.createElement('div');tmp.innerHTML=phAutobar(s).trim();if(tmp.firstChild)ab.replaceWith(tmp.firstChild);}
  const tc=document.querySelector('.tool-count');if(tc)tc.textContent=s.markers.length;
  const pc=document.querySelector('.pop-count');if(pc)pc.textContent=s.populations.length;
  if(scroll)scroll.scrollTop=top;
}

function phCellSelect(sid,pid,mid,val){
  let opts='<option value="">·</option>';
  S.ph.options.forEach(o=>{opts+=`<option value="${o.id}" ${o.id===val?'selected':''}>${esc(o.label)}</option>`;});
  const o=S.ph.options.find(x=>x.id===val);const bg=o?o.color:'transparent';const fg=o?textColor(o.color):'transparent';
  return `<select class="cell-sel${o?'':' empty'}" style="background:${bg};color:${fg}" onchange="phSetValue('${sid}','${pid}','${mid}',this.value)">${opts}</select>`;
}

function phViewSettings(){
  const opts=S.ph.options.map(o=>`<div class="opt-row"><label class="color-wrap" title="Color"><input type="color" value="${o.color}" onchange="phUpdateOption('${o.id}',{color:this.value})"><span class="sw" style="width:24px;height:24px;border-radius:6px;background:${o.color}"></span></label><input class="txt-in" style="flex:1;min-width:100px;font-family:ui-monospace,monospace" value="${esc(o.label)}" placeholder="Etiqueta" onchange="phUpdateOption('${o.id}',{label:this.value})"><span class="preview" style="background:${o.color};color:${textColor(o.color)}">${esc(o.label)}</span><select class="sel sm" title="Cuenta como (para los %)" onchange="phUpdateOption('${o.id}',{cat:this.value})"><option value=""${!o.cat?' selected':''}>No aplica</option><option value="pos"${o.cat==='pos'?' selected':''}>Positivo</option><option value="neg"${o.cat==='neg'?' selected':''}>Negativo</option><option value="het"${o.cat==='het'?' selected':''}>Heterogéneo</option></select><button class="ic-x" title="Eliminar" onclick="phRemoveOption('${o.id}')">${ic('trash',15)}</button></div>`).join('');
  const optOpts=S.ph.options.map(o=>`<option value="${o.id}">${esc(o.label)}</option>`).join('');
  const presets=S.ph.presets.length?S.ph.presets.map(p=>`<div class="opt-row" style="align-items:flex-start"><input class="txt-in" style="flex:0 0 190px" value="${esc(p.name)}" placeholder="Nombre del preset" onchange="phUpdatePreset('${p.id}',{name:this.value})"><input class="txt-in" style="flex:1;min-width:220px" value="${esc(p.markers.join(', '))}" placeholder="CD3, CD4, CD8, …" onchange="phUpdatePreset('${p.id}',{markers:this.value.split(',').map(x=>x.trim()).filter(Boolean)})"><span class="preset-count">${p.markers.length} marcadores</span><button class="ic-x" title="Eliminar preset" onclick="phRemovePreset('${p.id}')">${ic('trash',15)}</button></div>`).join(''):`<p class="sub">Aún no hay presets.</p>`;
  const ex=S.ph.export||{};const sc=S.scale||100;
  return `<button class="back-btn" onclick="phHome()">${ic('arrow-left',15)} Fenotipos</button>

    <div style="height:22px"></div>

function downloadText(name,text,type){const blob=new Blob([text],{type:type||'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function toCSV(aoa){return '﻿'+aoa.map(r=>r.map(c=>{c=c==null?'':String(c);return /[";\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(';')).join('\r\n');}
function toTSV(aoa){return aoa.map(r=>r.map(c=>c==null?'':String(c)).join('\t')).join('\n');}
// Genera un .xlsx real con celdas de texto (inlineStr): los valores salen tal cual, sin "=" ni "'"
function xlCol(n){let s='';while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26);}return s;}
function xlIsNum(v){const s=String(v==null?'':v).trim();return s!==''&&/^[+-]?[\d.,]+$/.test(s)&&/\d/.test(s);}
function buildXlsx(aoa,sheetName){
  sheetName=(sheetName||'Hoja1').replace(/[\\\/?*\[\]:]/g,' ').slice(0,31)||'Hoja1';
  let rows='';
  aoa.forEach((row,ri)=>{let cells='';(row||[]).forEach((val,ci)=>{const ref=xlCol(ci+1)+(ri+1);const sv=(val==null?'':String(val));
    if(xlIsNum(sv)){const n=celNum(sv);if(n!=null){cells+='<c r="'+ref+'" t="n"><v>'+n+'</v></c>';return;}}
    cells+='<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+xe(sv)+'</t></is></c>';});rows+='<row r="'+(ri+1)+'">'+cells+'</row>';});
  const sheet='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>'+rows+'</sheetData></worksheet>';
  const wb='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="'+xe(sheetName)+'" sheetId="1" r:id="rId1"/></sheets></workbook>';
  const wbRels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>';
  const styles='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="1"><font><sz val="11"/><name val="Calibri"/></font></fonts><fills count="1"><fill><patternFill patternType="none"/></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
  const ct='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>';
  const rels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';
  return zipStore([
    {name:'[Content_Types].xml',data:strBytes(ct)},
    {name:'_rels/.rels',data:strBytes(rels)},
    {name:'xl/workbook.xml',data:strBytes(wb)},
    {name:'xl/_rels/workbook.xml.rels',data:strBytes(wbRels)},
    {name:'xl/worksheets/sheet1.xml',data:strBytes(sheet)},
    {name:'xl/styles.xml',data:strBytes(styles)}
  ]);
}

function phMarkerSort(a,b){return (a.name||'').localeCompare(b.name||'','es',{numeric:true,sensitivity:'base'});}
